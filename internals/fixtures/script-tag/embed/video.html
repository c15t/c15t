<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Video embed</title>
		<style>
			body {
				margin: 0;
				font: 14px system-ui;
				color: #fff;
				background: #111;
				display: grid;
				place-items: center;
				height: 100vh;
			}
			p {
				text-align: center;
			}
			.play {
				width: 0;
				height: 0;
				border-left: 28px solid #fff;
				border-top: 16px solid transparent;
				border-bottom: 16px solid transparent;
				margin: 0 auto 12px;
			}
		</style>
	</head>
	<body>
		<p>
			<span class="play"></span><strong>Video embed</strong><br />This iframe
			only received a <code>src</code> after the <em>marketing</em> category was
			granted.
		</p>
	</body>
</html>
