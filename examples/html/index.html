<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<title>c15t with a script tag</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 2rem;
			}
		</style>
		<!-- #region docs:script-tag title="index.html" -->
		<script
			src="https://your-project.inth.app/c15t.js"
			defer
		></script>
		<!-- #endregion docs:script-tag -->
		<!-- #region docs:vendor-scripts title="index.html" -->
		<!-- PostHog's snippet, saved as a file on your site -->
		<script
			type="text/plain"
			data-c15t-category="measurement"
			src="/posthog.js"
		></script>
		<!-- #endregion docs:vendor-scripts -->
	</head>
	<body>
		<main>
			<h1>c15t with a script tag</h1>
			<p>PostHog loads once you allow measurement.</p>
		</main>
		<footer>
			<!-- #region docs:preferences-link title="index.html" -->
			<a href="#c15t-preferences">Privacy settings</a>
			<!-- #endregion docs:preferences-link -->
		</footer>
	</body>
</html>
