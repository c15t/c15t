name: Set up workspace
description: Install the pinned toolchain and optionally restore this run's package builds.
inputs:
  node-version:
    description: Node.js version for this job. Release tooling requires Node 24.
    default: '22'
  built:
    description: Restore package outputs and task cache from the build job.
    default: 'false'
  browsers:
    description: Install Chromium for the resolved Playwright versions.
    default: 'false'
  cache-scope:
    description: Independent cache for this job's completed tasks.
    default: build
  registry-url:
    description: Package registry configured for release publishing.
    default: ''
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: 1.3.11
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    - shell: bash
      run: bun install --frozen-lockfile
    # Vercel also checks the repository ID, branch, event, and workflow claims.
    # PRs keep using local caches without a credential for the shared remote cache.
    - name: Authenticate to Turborepo Remote Cache
      if: >-
        github.repository == 'c15t/c15t' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name) && contains(fromJSON('["refs/heads/main", "refs/heads/canary", "refs/heads/2.0.0", "refs/heads/v3"]'), github.ref)
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      with:
        team: ${{ vars.TURBO_TEAM }}
        audience: https://vercel.com/inth
        policy: ${{ vars.TURBO_CACHE_POLICY }}
        revoke: true
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .turbo/cache
        key: turbo-v2-${{ runner.os }}-${{ inputs.cache-scope }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          turbo-v2-${{ runner.os }}-${{ inputs.cache-scope }}-${{ github.sha }}-
          turbo-v2-${{ runner.os }}-${{ inputs.cache-scope }}-
          turbo-${{ runner.os }}-
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: inputs.built == 'true'
      with:
        name: ci-build
    - shell: bash
      if: inputs.built == 'true'
      run: tar -xf ci-build.tar
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.browsers == 'true'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    # Always install system dependencies, even when the browser archive was cached.
    - shell: bash
      if: inputs.browsers == 'true'
      run: bun scripts/install-browsers.ts --with-deps
