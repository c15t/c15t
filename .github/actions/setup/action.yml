name: Set up workspace
description: Install the pinned toolchain and optionally restore this run's package builds.
inputs:
  built:
    description: Restore package outputs and task cache from the build job.
    default: 'false'
  browsers:
    description: Install Chromium for the resolved Playwright versions.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
      with:
        bun-version: 1.3.11
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
    - shell: bash
      run: bun install --frozen-lockfile
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.built != 'true'
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: inputs.built == 'true'
      with:
        name: ci-build
    - shell: bash
      if: inputs.built == 'true'
      run: tar -xf ci-build.tar
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: inputs.browsers == 'true'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    # Always install system dependencies, even when the browser archive was cached.
    - shell: bash
      if: inputs.browsers == 'true'
      run: bun scripts/install-browsers.ts --with-deps
