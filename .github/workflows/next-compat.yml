name: Next.js Compatibility

# Builds and smoke-tests @c15t/nextjs inside real Next.js apps, one job per
# framework cell (version × router × caching mode). See
# internals/next-compat/README.md for what each cell asserts.

on:
  schedule:
    # Nightly, so a new Next.js release breaks this workflow before it breaks
    # a user. The canary job below only runs on this trigger and on dispatch.
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  # leadtype package-docs generation exceeds the default Node heap on
  # cache-miss builds of larger packages (core, react).
  NODE_OPTIONS: --max-old-space-size=6144
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canary:
    name: next@canary (next-${{ matrix.cell }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Advisory: a Next.js canary regression should not block anything, it
    # should get looked at.
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cell:
          - 16-app
          - 16-pages
          - 16-cache-components
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: |
          PLAYWRIGHT_VERSION=$(bun -e "console.log(require('./package.json').devDependencies.playwright)")
          bunx "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium chromium-headless-shell

      # bunfig.toml delays new npm versions by three days; a canary is by
      # definition newer than that, so the gate is lifted for this one add.
      - name: ⏭️ Switch the cell to next@canary
        run: |
          cd "internals/next-compat/next-${{ matrix.cell }}"
          bun add "next@canary" --minimum-release-age=0
          bun -e "console.log('next', require('next/package.json').version)"

      - name: 🧪 Build the app and run the compatibility suite
        run: bun turbo run test:compat --filter="@c15t/next-compat-${{ matrix.cell }}"
