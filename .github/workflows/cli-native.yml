name: Native CLI

on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'docs/cli/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/cli-native.yml'
  push:
    branches: [v3]
    paths:
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'docs/cli/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/cli-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Static frontend / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install the Linux native compiler
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang build-essential
      - run: bun install --frozen-lockfile
      - name: Build CLI and workspace dependencies
        run: bun turbo run build --filter=@c15t/cli
      - name: Install the pinned compiler API outside the workspace
        # The 0.2.0 scriptc CLI's macOS launcher is missing from npm.
        # The compiler API supports static compilation on both platforms.
        run: npm install --prefix "$RUNNER_TEMP/scriptc" --no-audit --no-fund @scriptc/compiler@0.2.0
      - name: Compile packed sources and exercise native frontend commands
        run: SCRIPTC_COMPILER_ROOT="$RUNNER_TEMP/scriptc/node_modules/@scriptc/compiler" bun run --cwd packages/cli test:native
