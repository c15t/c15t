name: Report Coverage

on:
  workflow_run:
    # Important: Match the name of your testing workflow file (ci.yml -> CI)
    workflows: ["CI"]
    types:
      - completed # Trigger when the CI workflow finishes

jobs:
  report:
    name: Generate Coverage Comment(s)
    runs-on: ubuntu-latest
    # Only run this job if the triggering workflow run was successful AND was triggered by a pull_request event
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}

    # Specifying `permissions` sets every unlisted scope to `none`, so each
    # scope this job actually needs has to be listed explicitly.
    permissions:
      actions: read # inspect the triggering CI run and its artifacts
      pull-requests: read # resolve the pull request for the run

    outputs: # Define outputs for the matrix generation job
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      pr_number: ${{ steps.pr.outputs.number }}

    steps:
      # The reporting action cannot reliably infer a PR from workflow_run, so
      # resolve exactly one matching PR and pass it down explicitly.
      - name: Resolve pull request number
        id: pr
        # Values reach the script through the environment rather than template
        # expansion — interpolating `${{ }}` straight into `run:` lets
        # attacker-influenced fields expand into executable shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          run_json=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}")
          head_sha=$(jq -er \
            '.head_sha | select(type == "string" and length > 0)' \
            <<< "$run_json")
          head_branch=$(jq -er \
            '.head_branch | select(type == "string" and length > 0)' \
            <<< "$run_json")
          head_repository_url=$(jq -er \
            '.head_repository.url | select(type == "string" and length > 0)' \
            <<< "$run_json")

          candidates=$(jq -c \
            --arg repository "$head_repository_url" \
            --arg branch "$head_branch" \
            '[
              .pull_requests[]?
              | select(
                  .head.repo.url == $repository and
                  .head.ref == $branch
                )
              | .number
            ] | unique' \
            <<< "$run_json")
          candidate_count=$(jq -r 'length' <<< "$candidates")

          if [ "$candidate_count" -eq 0 ]; then
            pull_pages=$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${head_sha}/pulls?per_page=100")
            candidates=$(jq -c \
              --arg repository "$head_repository_url" \
              --arg branch "$head_branch" \
              '[
                .[][]
                | select(
                    .head.repo.url == $repository and
                    .head.ref == $branch
                  )
                | .number
              ] | unique' \
              <<< "$pull_pages")
            candidate_count=$(jq -r 'length' <<< "$candidates")
          fi

          if [ "$candidate_count" -ne 1 ]; then
            printf \
              'Expected one PR for %s:%s at %s; found %s: %s\n' \
              "$head_repository_url" \
              "$head_branch" \
              "$head_sha" \
              "$candidate_count" \
              "$candidates" >&2
            exit 1
          fi

          number=$(jq -r '.[0]' <<< "$candidates")
          printf 'Resolved pull request: %s\n' "$number"
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"

      # An affected-only CI run can legitimately test nothing (a docs-only PR),
      # and then no artifact exists. Probe for it rather than blanket-tolerating
      # download failures, so a genuine download error still fails loudly.
      - name: Check for coverage artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          artifact_pages=$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          count=$(jq -r \
            '[
              .[].artifacts[]
              | select(
                  .name == "individual-coverage-data" and
                  .expired == false
                )
            ] | length' \
            <<< "$artifact_pages")

          printf 'Matching artifacts: %s\n' "$count"
          if [ "$count" -gt 0 ]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      # Download the coverage artifacts uploaded by the CI workflow
      - name: Download Individual Coverage Reports
        if: steps.artifact.outputs.exists == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: individual-coverage-data # Match upload name
          # Download to a predictable directory, maintaining structure
          path: coverage-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: List Downloaded Files (for debugging)
        run: |
          mkdir -p coverage-artifacts
          find coverage-artifacts -type f

      - name: Generate Matrix from Found Reports
        id: generate-matrix
        run: |
          matrix=()
          # Find summary files and extract package/app name and path prefix
          while IFS= read -r file; do
            # Extract path like "packages/core" or "apps/my-app" from "coverage-artifacts/packages/core/coverage/coverage-summary.json"
            prefix=$(dirname "$file" | sed -E 's|coverage-artifacts/([^/]+/[^/]+)/coverage$|\1|')
            package_name=$(basename "$(dirname "$(dirname "$file")")")
            # Use package name unless it's just 'packages' or 'apps', then use prefix
            display_name=$([[ "$package_name" == "packages" || "$package_name" == "apps" ]] && echo "$prefix" || echo "$package_name")
            # Ensure final report exists for this package
            final_path="${prefix}/coverage/coverage-final.json"
            if [[ -f "coverage-artifacts/$final_path" ]]; then
              matrix+=("{ \"name\": \"$display_name\", \"summary_path\": \"$file\", \"final_path\": \"coverage-artifacts/$final_path\" }")
            else 
              # If no final report, only include summary
              matrix+=("{ \"name\": \"$display_name\", \"summary_path\": \"$file\", \"final_path\": \"\" }") 
            fi
          done < <(find coverage-artifacts -path '*/coverage/coverage-summary.json' -type f)
          
          echo "Generated matrix: $(IFS=,; echo "[${matrix[*]}]")"
          echo "matrix=[$(IFS=,; echo "${matrix[*]}")]" >> "$GITHUB_OUTPUT"

  # New job that depends on the matrix generation
  report_coverage_matrix:
    name: Report Coverage (${{ matrix.package.name }})
    needs: report # Depends on the job that generated the matrix
    runs-on: ubuntu-latest
    if: needs.report.outputs.matrix != '[]' # Only run if matrix is not empty
    permissions:
      actions: read # re-download artifacts from the triggering CI run
      pull-requests: write # post the coverage comment
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.report.outputs.matrix) }}

    steps:
      # We need to re-download the artifact in each matrix job
      - name: Download Individual Coverage Reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: individual-coverage-data # Match upload name
          path: coverage-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          
      - name: 📊 Report Coverage Comment on PR
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b
        with:
          name: ${{ matrix.package.name }} # Use package name for comment section title
          # These inputs are hyphenated, not underscored. They were previously
          # passed as `json_summary_path`/`json_final_path`, which Actions
          # silently discards as unknown inputs — the action then fell back to
          # its default `coverage/coverage-summary.json` and every matrix job
          # failed with ENOENT.
          json-summary-path: ${{ matrix.package.summary_path }}
          # Only include final path if it exists (not empty string)
          json-final-path: ${{ matrix.package.final_path || '' }}
          pr-number: ${{ needs.report.outputs.pr_number }}
