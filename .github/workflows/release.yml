# .github/workflows/release.yml
name: Release

on:
  push:
    branches: ['main', 'canary', '2.0.0', 'v3']

permissions: {}

# Canary publishes a snapshot for every commit, in push order, so its runs stay
# queued whole. Every other branch gets a group per run: checks for consecutive
# pushes overlap, and only the publish job below waits its turn.
concurrency:
  group: release-run-${{ github.ref == 'refs/heads/canary' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # npm trusted publishing binds the OIDC identity to the *top-level* workflow
  # file. Publishing must therefore start here and pull the checks in, rather
  # than `ci.yml` calling this file — the reverse arrangement presents
  # `ci.yml` as the workflow and npm rejects the token.
  checks:
    name: Checks
    if: github.repository == 'c15t/c15t'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip_performance: true
      mobile_diff_base: ${{ github.ref == 'refs/heads/v3' && github.event.before || '' }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  # Outside canary, checks overlap, so an older push can finish them after a
  # newer one. Releasing it would run Tegami on a stale tree, for example
  # reopening a version PR the newer commit already merged, so a superseded
  # run does not release. This runs as its own job, before `publish` joins the
  # release group: the group holds one pending job, and a superseded run taking
  # that slot would push out the tip's publish job and then skip itself.
  tip:
    name: Check branch tip
    needs: checks
    if: github.repository == 'c15t/c15t'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - name: Skip superseded commits
        id: tip
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/canary ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(git ls-remote --exit-code "$REPOSITORY_URL" "$GITHUB_REF" | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::Could not read $GITHUB_REF from $REPOSITORY_URL."
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not releasing $GITHUB_SHA: $GITHUB_REF is now at $tip, and that run releases this commit if its checks pass."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Release ${{ github.ref == 'refs/heads/v3' && 'Alpha' || github.ref == 'refs/heads/canary' && 'Canary' || github.ref == 'refs/heads/2.0.0' && 'RC' || '' }}
    needs: [checks, tip]
    # Only one release per branch publishes at a time.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tegami creates releases, tags, and version commits
      pull-requests: write # Tegami opens version pull requests
      id-token: write # Required for OIDC trusted publishing with npm (bypasses 2FA requirement)

    if: github.repository == 'c15t/c15t' && needs.tip.outputs.current == 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Tegami uses release tags and changelog history.
          fetch-depth: 0

      # Setup Bun using the version from the shared checks workflow.
      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Keep npm's OIDC support explicit even if the Node runner image changes.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile # Use frozen lockfile for reliability in CI

      - name: Version or publish packages
        if: github.ref != 'refs/heads/canary'
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Each canary commit gets its own snapshot; never reuse a lock synced from main.
      - name: Version and publish canary snapshot
        if: github.ref == 'refs/heads/canary'
        run: |
          bun run tegami version --no-checks
          bun run tegami publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
