# .github/workflows/release.yml
name: Release

on:
  push:
    branches: ['main', 'canary', '2.0.0', 'v3']

permissions: {}

# Keep checks and publishing in the same branch-level concurrency group.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # npm trusted publishing binds the OIDC identity to the *top-level* workflow
  # file. Publishing must therefore start here and pull the checks in, rather
  # than `ci.yml` calling this file — the reverse arrangement presents
  # `ci.yml` as the workflow and npm rejects the token.
  checks:
    name: Checks
    if: github.repository == 'c15t/c15t'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      skip_performance: true
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  publish:
    name: Release ${{ github.ref == 'refs/heads/v3' && 'Alpha' || github.ref == 'refs/heads/canary' && 'Canary' || github.ref == 'refs/heads/2.0.0' && 'RC' || '' }}
    needs: checks
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tegami creates releases, tags, and version commits
      pull-requests: write # Tegami opens version pull requests
      id-token: write # Required for OIDC trusted publishing with npm (bypasses 2FA requirement)

    if: github.repository == 'c15t/c15t'
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Tegami uses release tags and changelog history.
          fetch-depth: 0

      # Setup Bun using the version from the shared checks workflow.
      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Keep npm's OIDC support explicit even if the Node runner image changes.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile # Use frozen lockfile for reliability in CI

      - name: Version or publish packages
        if: github.ref != 'refs/heads/canary'
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Each canary commit gets its own snapshot; never reuse a lock synced from main.
      - name: Version and publish canary snapshot
        if: github.ref == 'refs/heads/canary'
        run: |
          bun run tegami version --no-checks
          bun run tegami publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
