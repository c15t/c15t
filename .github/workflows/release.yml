# .github/workflows/release.yml
name: Release

# 2.x maintenance releases. Pushes to release/v2 open or update a version PR.
# Merging that PR publishes under the `v2-legacy` npm tag.
on:
  push:
    branches: ['release/v2']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip CI and publish after building and checking package artifacts
        type: boolean
        default: false

permissions: {}

# Each run gets its own group, so checks for consecutive pushes overlap and
# only the publish job below waits its turn. `queue: max` keeps every waiting
# run; by default a new one cancels the one already waiting.
concurrency:
  group: release-run-${{ github.run_id }}
  queue: max

jobs:
  # npm trusted publishing binds the OIDC identity to the *top-level* workflow
  # file. Publishing must therefore start here and pull the checks in, rather
  # than `ci.yml` calling this file — the reverse arrangement presents
  # `ci.yml` as the workflow and npm rejects the token.
  checks:
    name: Checks
    if: github.repository == 'c15t/c15t' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Release v2
    needs: checks
    # Only one release per branch publishes at a time.
    concurrency:
      group: release-${{ github.ref }}
      queue: max
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tegami creates releases, tags, and version commits
      pull-requests: write # Tegami opens version pull requests
      id-token: write # Required for OIDC trusted publishing with npm (bypasses 2FA requirement)

    if: >-
      !cancelled() && github.repository == 'c15t/c15t' && (needs.checks.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_tests && needs.checks.result == 'skipped'))
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Tegami uses release tags and changelog history.
          fetch-depth: 0

      # Without `bun-version`, setup-bun reads `packageManager` from package.json.
      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Keep npm's OIDC support explicit even if the Node runner image changes.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Checks overlap, so an older push can reach this job after a newer one.
      # Releasing it would run Tegami on a stale tree, for example reopening a
      # version PR the newer commit already merged, so a superseded run does
      # not release. The check runs here, after this job holds the release
      # group, so the tip it reads is as recent as possible.
      - name: Skip superseded commits
        id: tip
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tip=$(git ls-remote --exit-code "$REPOSITORY_URL" "$GITHUB_REF" | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::Could not read $GITHUB_REF from $REPOSITORY_URL."
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not releasing $GITHUB_SHA: $GITHUB_REF is now at $tip, and that run releases this commit if its checks pass."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version or publish packages
        if: steps.tip.outputs.current == 'true'
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # Tegami builds every library before publishing. Match ci.yml's heap
          # for the package-docs step on cache-miss builds.
          NODE_OPTIONS: --max-old-space-size=6144
