# .github/workflows/release.yml
name: Release

on:
  push:
    branches: ['main', 'canary', '2.0.0', 'v3']

permissions: {}

# Canary publishes a snapshot for every commit, so its runs stay queued whole,
# in the order they start. Every other branch gets a group per run: checks for consecutive
# pushes overlap, and only the publish job below waits its turn. `queue: max`
# keeps every waiting run; by default a new one cancels the one already waiting.
concurrency:
  group: release-run-${{ github.ref == 'refs/heads/canary' && github.ref || github.run_id }}
  queue: max

jobs:
  # npm trusted publishing binds the OIDC identity to the *top-level* workflow
  # file. Publishing must therefore start here and pull the checks in, rather
  # than `ci.yml` calling this file — the reverse arrangement presents
  # `ci.yml` as the workflow and npm rejects the token.
  checks:
    name: Checks
    if: github.repository == 'c15t/c15t'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      skip_performance: true
      release_affected: ${{ github.ref == 'refs/heads/v3' }}
      skip_mobile_device: true
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  publish:
    name: Release ${{ github.ref == 'refs/heads/v3' && 'Alpha' || github.ref == 'refs/heads/canary' && 'Canary' || github.ref == 'refs/heads/2.0.0' && 'RC' || '' }}
    needs: checks
    # Only one release per branch publishes at a time.
    concurrency:
      group: release-${{ github.ref }}
      queue: max
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Tegami creates releases, tags, and version commits
      pull-requests: write # Tegami opens version pull requests
      id-token: write # Required for OIDC trusted publishing with npm (bypasses 2FA requirement)

    if: github.repository == 'c15t/c15t'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Tegami uses release tags and changelog history.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          built: ${{ needs.checks.outputs.built }}
          cache-scope: publish

      # Keep npm's OIDC support explicit even if the Node runner image changes.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      # Outside canary, checks overlap, so an older push can reach this job after
      # a newer one. Releasing it would run Tegami on a stale tree, for example
      # reopening a version PR the newer commit already merged, so a superseded
      # run does not release. The check runs here, after this job holds the
      # release group, so the tip it reads is as recent as possible.
      - name: Skip superseded commits
        id: tip
        if: github.ref != 'refs/heads/canary'
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tip=$(git ls-remote --exit-code "$REPOSITORY_URL" "$GITHUB_REF" | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::Could not read $GITHUB_REF from $REPOSITORY_URL."
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not releasing $GITHUB_SHA: $GITHUB_REF is now at $tip, and that run releases this commit if its checks pass."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version or publish packages
        if: github.ref != 'refs/heads/canary' && steps.tip.outputs.current == 'true'
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Each canary commit gets its own snapshot; never reuse a lock synced from main.
      - name: Version and publish canary snapshot
        if: github.ref == 'refs/heads/canary'
        run: |
          bun run tegami version --no-checks
          bun run tegami publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - uses: ./.github/actions/save-turbo-cache
        with:
          scope: publish
