name: Runnable examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'internals/next-compat/shared/src/fixture/**'
      - 'docs/frameworks/**'
      - 'docs/shared/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/example-conformance.yml'
  push:
    branches: ['canary', 'main', 'v3']
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'internals/next-compat/shared/src/fixture/**'
      - 'bun.lock'
      - '.github/workflows/example-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            nextjs,
            react,
            vue,
            svelte,
            javascript,
            nuxt,
            tanstack-start,
            astro,
            sveltekit,
          ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Build package dependencies
        run: bun turbo run build --filter='./packages/*' --concurrency=4
      - name: Install Chromium
        run: bunx playwright@1.61.1 install --with-deps chromium
      - name: Build and test the example
        env:
          EXAMPLE_TARGET: ${{ matrix.target }}
        run: bun run --cwd examples/shared test
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: example-${{ matrix.target }}
          path: examples/shared/artifacts
          if-no-files-found: ignore
          retention-days: 7
