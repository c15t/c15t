name: Benchmark Regression

on:
  workflow_call:
    inputs:
      base_ref:
        type: string
        default: 'HEAD^'
      mode:
        type: string
        default: quick
      built:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      base_ref:
        description: Revision to compare with
        default: 'HEAD^'
      mode:
        description: Runtime coverage
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  benchmark:
    name: Runtime regression budgets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          built: ${{ inputs.built || false }}
          browsers: 'true'
      - name: Measure base and head in sequence
        env:
          BENCHMARK_BASE_REF: ${{ inputs.base_ref || 'HEAD^' }}
          BENCHMARK_MODE: ${{ inputs.mode || 'full' }}
        run: bun scripts/benchmark-run.ts "$BENCHMARK_MODE"
      - name: Save measurements and comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-benchmarks
          path: .ci-reports/
          retention-days: 14
