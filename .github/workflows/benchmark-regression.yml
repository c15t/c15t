name: Benchmark Regression

on:
  push:
    branches: ['v3']
  schedule:
    - cron: '43 2 * * *'
  workflow_call:
    inputs:
      base_ref:
        type: string
        default: 'HEAD^'
      mode:
        type: string
        default: quick
      built:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      branch:
        description: Published branch to benchmark
        type: choice
        options: [v3, main, canary]
        default: v3
      base_ref:
        description: Revision to compare with
        default: 'HEAD^'
      mode:
        description: Runtime coverage
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  plan:
    name: Select benchmark packages and revisions
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Dispatch can select only these trusted branches. PR callers retain
          # their event SHA and PR cache scope; scheduled runs always use v3.
          ref: ${{ github.event_name == 'schedule' && 'v3' || github.event_name == 'workflow_dispatch' && (inputs.branch == 'main' && 'main' || inputs.branch == 'canary' && 'canary' || 'v3') || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11
      - name: Plan benchmark matrix
        id: plan
        env:
          BENCHMARK_BASE_REF: ${{ inputs.base_ref || 'HEAD^' }}
          BENCHMARK_MODE: ${{ inputs.mode || 'full' }}
        run: |
          matrix=$(bun scripts/benchmark-plan.ts "$BENCHMARK_MODE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          bun scripts/benchmark-revisions.ts >> "$GITHUB_OUTPUT"

  benchmark:
    name: Runtime regression budgets (${{ matrix.id }})
    needs: plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          built: ${{ inputs.built || false }}
          browsers: 'true'
      - name: Measure base and head in sequence
        env:
          BENCHMARK_BASE_REF: ${{ needs.plan.outputs.base_sha }}
          BENCHMARK_MODE: ${{ inputs.mode || 'full' }}
          BENCHMARK_PACKAGE: ${{ matrix.package }}
        run: bun scripts/benchmark-run.ts "$BENCHMARK_MODE"
      - name: Save measurements and comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-benchmarks-${{ matrix.id }}
          path: .ci-reports/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
