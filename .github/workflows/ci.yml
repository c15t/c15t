name: CI

on:
  push:
    # `canary` is the default branch and PR target, so it needs the full suite
    # as the backstop for the affected-only checks that run on pull requests.
    branches: ['main', 'canary', '2.0.0']
  pull_request:
    types: [opened, synchronize]

env:
  # The leadtype package-docs generation inside package builds exceeds Node's
  # default heap on cache-miss builds of the larger packages (core, react).
  NODE_OPTIONS: --max-old-space-size=6144
  # Pull-request checkouts are detached merge commits, so Turborepo cannot
  # resolve the base as a local branch even with full history. Track the PR's
  # real target so release PRs into `main` or `2.0.0` diff against the right
  # branch instead of always against `canary`.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/canary' }}

jobs:
  lint_and_check:
    name: 🧹 Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed for checkout
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Read-only: the test job is the single writer of this cache (see below).
      - name: ♻️ Restore Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Deliberately not affected-scoped: this is the always-on cross-package
      # signal that catches breakage in packages a PR does not touch directly.
      - name: 👀 Type Check
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: bun turbo run check-types

      - name: 🧹 Lint
        run: bun oxlint . --format=github

      - name: 🎨 Check formatting
        run: bun run fmt:check

  build:
    name: 🏗️ Build Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed for checkout
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Full history so Turborepo can resolve the base branch for --affected.
          fetch-depth: 0
          persist-credentials: false

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Read-only: the test job is the single writer of this cache (see below).
      - name: ♻️ Restore Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 🏗️ Build
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun turbo run build --filter="./packages/*" --affected
          else
            bun turbo run build --filter="./packages/*"
          fi

  test:
    name: 🧪 Run Tests & Coverage
    needs: build # Run only after build succeeds
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed for checkout
    # @c15t/backend supports Postgres, MySQL and SQLite, and its test matrix
    # runs against whichever of them the environment provides. Without these
    # services the MySQL and real-Postgres arms silently skip — which is how
    # the package once shipped unable to execute a single statement against
    # MySQL with a green suite (RFC 0004 §11.7).
    #
    # SQLite and PGlite need nothing: both run in-process.
    services:
      postgres:
        # Pinned by digest, as the repo's action-security policy requires
        # of every image and action reference.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: c15t
          POSTGRES_DB: c15t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: c15t
          MYSQL_DATABASE: c15t
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pc15t --silent" --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Full history so Turborepo can resolve the base branch for --affected.
          fetch-depth: 0
          persist-credentials: false

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Root repository tooling is not part of the package Turbo graph, so run
      # its focused tests on every CI event before installing browsers.
      - name: 🧰 Test repository scripts
        run: bun run test:scripts

      # This job is the single writer of the shared Turborepo cache: it builds
      # every package as a dependency of `test`, so its cache is the most
      # complete, and one writer means no concurrent-save conflicts.
      - name: ♻️ Restore Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 🎭 Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(bun -e "console.log(require('./package.json').devDependencies.playwright)")" >> "$GITHUB_OUTPUT"

      - name: 🎭 Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version rather than the lockfile hash —
          # browsers only change when Playwright does, and lockfile churn was
          # invalidating them on every unrelated dependency bump.
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: 🎭 Install Playwright browsers
        run: bunx "playwright@${{ steps.playwright.outputs.version }}" install --with-deps chromium chromium-headless-shell

      # Save immediately after installation so a later test failure does not
      # discard a successfully prepared browser cache.
      - name: 🎭 Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: 🧪 Run Tests
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
          # Opt the backend's matrix into the two engines that need a server.
          C15T_TEST_PG_URL: postgres://postgres:c15t@127.0.0.1:5432/c15t
          C15T_TEST_MYSQL_URL: mysql://root:c15t@127.0.0.1:3306/c15t
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun turbo run test --filter="./packages/*" --filter="./internals/*" --filter="./apps/*" --affected
          else
            bun turbo run test --filter="./packages/*" --filter="./internals/*" --filter="./apps/*"
          fi

      - name: 🧪 Run Root Script Tests
        run: bun run test:scripts

      # Restored entries are carried into the next save, so the cache would
      # grow without bound across pushes and thrash the repo's 10GB budget.
      # Prune complete task entries to a 1 GiB ceiling. This runs on every event
      # so the script is exercised on PRs, but remains non-fatal because a prune
      # failure should only produce a larger cache, never failed product CI.
      - name: ♻️ Prune Turborepo cache
        continue-on-error: true
        run: bun scripts/prune-turbo-cache.ts

      # Written only from pushes to publishing branches. PR runs restore
      # read-only so they cannot churn the cache budget, matching the posture
      # for TURBO_TOKEN.
      - name: ♻️ Save Turborepo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

      - name: ⬆️ Upload Individual Coverage Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: individual-coverage-data # Artifact containing all raw reports
          path: |
            packages/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-final.json
            apps/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-final.json
            # Add other potential locations if necessary
          retention-days: 7
          # Optional: Handle case where no files are found gracefully
          if-no-files-found: warn # 'warn', 'error', or 'ignore'

  parity:
    name: 🔀 Cross-framework parity & storybook tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🎭 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: 🎭 Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Both resolved Playwright versions need browsers: 1.61.1 (root
        # `playwright`, storybook test-runner) and 1.62.0 (@playwright/test
        # in the parity runner).
        run: |
          bunx playwright@1.61.1 install --with-deps chromium
          bunx playwright@1.62.0 install --with-deps chromium

      - name: 🏗️ Build Storybooks
        # Use turbo so workspace deps (notably @c15t/ui CSS dist) build
        # before the storybook builds consume them via PostCSS @import.
        run: bun turbo run build --filter=@c15t/storybook-react --filter=@c15t/storybook-svelte --filter=@c15t/storybook-vue --filter=@c15t/storybook-astro

      - name: 🌐 Serve Storybooks
        run: |
          # Warm Bun's executable cache before starting concurrent servers.
          # Concurrent cold `bunx` installs can race and leave one server absent.
          bunx http-server --version
          bunx --no-install http-server apps/storybook-react/storybook-static --port 6006 --silent &
          bunx --no-install http-server apps/storybook-svelte/storybook-static --port 6007 --silent &
          bunx --no-install http-server apps/storybook-vue/storybook-static --port 6008 --silent &
          bunx --no-install http-server apps/storybook-astro/storybook-static --port 6010 --silent &
          # Wait for all to be reachable before continuing.
          for port in 6006 6007 6008 6010; do
            ready=false
            for i in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/index.json" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              echo "Storybook on port $port did not become ready" >&2
              exit 1
            fi
          done

      - name: 🔀 Run parity suite
        env:
          REACT_STORYBOOK_URL: http://127.0.0.1:6006
          SVELTE_STORYBOOK_URL: http://127.0.0.1:6007
          VUE_STORYBOOK_URL: http://127.0.0.1:6008
          ASTRO_STORYBOOK_URL: http://127.0.0.1:6010
          PARITY_FRAMEWORKS: react,svelte,vue,astro
        # --ignore-snapshots: committed screenshot baselines are darwin-only;
        # DOM/a11y/computed-style parity is still fully enforced. Drop the
        # flag once linux baselines are generated (e.g. via the Playwright
        # docker image) and committed.
        run: bun run --cwd apps/parity-runner test:parity --ignore-snapshots

      - name: 📖 Run Storybook interaction tests (react)
        if: ${{ !cancelled() }}
        env:
          STORYBOOK_URL: http://127.0.0.1:6006
        run: bun run --cwd apps/storybook-react test-storybook

      - name: 📖 Run Storybook interaction tests (svelte)
        if: ${{ !cancelled() }}
        env:
          STORYBOOK_URL: http://127.0.0.1:6007
        run: bun run --cwd apps/storybook-svelte test-storybook

      - name: 📖 Run Storybook interaction tests (vue)
        if: ${{ !cancelled() }}
        env:
          STORYBOOK_URL: http://127.0.0.1:6008
        run: bun run --cwd apps/storybook-vue test-storybook

      - name: 📖 Run Storybook interaction tests (astro)
        if: ${{ !cancelled() }}
        env:
          STORYBOOK_URL: http://127.0.0.1:6010
        run: bun run --cwd apps/storybook-astro test-storybook

      - name: ⬆️ Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/parity-runner/playwright-report/
          retention-days: 7

  e2e_consent:
    name: 🌍 Consent journey e2e (Next.js + Nuxt)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🎭 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: 🎭 Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright@1.61.1 install --with-deps chromium

      - name: 🏗️ Build packages
        run: bun turbo run build --filter="./packages/*"

      - name: 🌍 Run consent journey e2e
        run: bun e2e:consent

  release:
    name: 🚀 Release
    needs: [lint_and_check, build, test]
    if: >-
      github.event_name == 'push' && github.repository == 'c15t/c15t' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary' || github.ref == 'refs/heads/2.0.0')
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
