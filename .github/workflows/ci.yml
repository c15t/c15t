name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      skip_performance:
        description: Run release checks without waiting for separate runtime benchmarks
        type: boolean
        default: false
      release_affected:
        description: Select changes since the last successful release on this branch
        type: boolean
        default: false
    outputs:
      built:
        description: Same-run library outputs are available in ci-build
        value: ${{ jobs.repository.outputs.build }}
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A new push to a pull request replaces its running checks. Every other run
# gets a group of its own: release checks for consecutive pushes run side by
# side, and release.yml serializes only the publish job.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=6144
  CI_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_CACHE_POLICY: ${{ vars.TURBO_CACHE_POLICY }}

jobs:
  repository:
    name: Repository and docs
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    outputs:
      build: ${{ steps.plan.outputs.build }}
      packageChecks: ${{ steps.plan.outputs.packageChecks }}
      backend: ${{ steps.plan.outputs.backend }}
      integrations: ${{ steps.plan.outputs.integrations }}
      testBrowsers: ${{ steps.plan.outputs.testBrowsers }}
      bundle: ${{ steps.plan.outputs.bundle }}
      performance: ${{ steps.plan.outputs.performance }}
      baseRef: ${{ steps.plan.outputs.baseRef }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          cache-scope: repository
      - name: Find the last validated release
        if: inputs.release_affected
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/ci-release-base.ts
      - name: Select checks
        id: plan
        env:
          CI_RELEASE_SELECTION: ${{ inputs.release_affected }}
        run: bun scripts/ci-plan.ts
      - name: Save selected checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 1
          if-no-files-found: error
      - name: Lint
        run: bun oxlint . --format=github
      - name: Check formatting
        run: bun run fmt:check
      - name: Test repository tooling and docs contracts
        run: bun run test:scripts
      - name: Generate package documentation
        if: steps.plan.outputs.docs == 'true'
        run: bun turbo run build:docs
      - uses: ./.github/actions/save-turbo-cache
        if: github.event_name != 'pull_request'
        with:
          scope: repository

  build:
    name: Build packages once
    permissions:
      contents: read
      id-token: write
    needs: repository
    if: needs.repository.outputs.build == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read selected checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-plan
      - run: bun scripts/ci-run.ts build
      - name: Package same-run outputs and task cache
        run: bun scripts/ci-build-artifact.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-build
          path: ci-build.tar
          retention-days: 1
      - uses: ./.github/actions/save-turbo-cache
        if: github.event_name != 'pull_request'
        with:
          scope: build

  # Types do not depend on Node, so they run once, beside the test legs rather
  # than ahead of the Node 24 tests.
  types:
    name: Package types
    permissions:
      contents: read
      id-token: write
    needs: [repository, build]
    if: ${{ !cancelled() && needs.repository.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.repository.outputs.packageChecks == 'true' }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
          built: ${{ needs.build.result == 'success' }}
          cache-scope: types
      - name: Read selected checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-plan
      - name: Check types
        run: bun scripts/ci-run.ts types
      - name: Check test types
        if: ${{ !cancelled() }}
        run: bun scripts/ci-run.ts testTypes
      - uses: ./.github/actions/save-turbo-cache
        if: ${{ success() && github.event_name != 'pull_request' }}
        with:
          scope: types

  packages:
    name: Package behavior (Node ${{ matrix.node }})
    permissions:
      contents: read
      id-token: write
    needs: [repository, build]
    if: ${{ !cancelled() && needs.repository.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.repository.outputs.packageChecks == 'true' }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 40
    # Tests run on each supported Node major, since runtime APIs such as
    # undici's Request differ between them. Coverage and the cache save do not
    # depend on Node and run once. `C15T_CI_NODE` reaches test hashes through
    # `transit`, so one leg's cached results never pass another.
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    env:
      C15T_CI_NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          built: ${{ needs.build.result == 'success' }}
          browsers: ${{ needs.repository.outputs.testBrowsers }}
          cache-scope: packages
      - name: Read selected checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-plan
      - name: Run tests
        run: bun scripts/ci-run.ts tests
      - name: Summarize coverage
        if: ${{ !cancelled() && matrix.node == '24' }}
        env:
          CI_DIFF_BASE: ${{ needs.repository.outputs.baseRef }}
        run: bun scripts/coverage-summary.ts --plan ci-plan.json
      - name: Save coverage and test evidence
        if: ${{ !cancelled() && matrix.node == '24' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-test-reports
          path: |
            packages/*/coverage/
            internals/*/coverage/
            apps/*/coverage/
            benchmarks/*/coverage/
          retention-days: 7
          if-no-files-found: ignore
      - uses: ./.github/actions/save-turbo-cache
        if: ${{ success() && github.event_name != 'pull_request' && matrix.node == '24' }}
        with:
          scope: packages

  backend:
    name: Database behavior and migrations
    permissions:
      contents: read
      id-token: write
    needs: [repository, build]
    if: needs.repository.outputs.backend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: c15t
          POSTGRES_DB: c15t
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: c15t
          MYSQL_DATABASE: c15t
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot -pc15t --silent" --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          built: 'true'
          cache-scope: backend
      - name: Test every supported database
        env:
          C15T_TEST_PG_URL: postgres://postgres:c15t@127.0.0.1:5432/c15t
          C15T_TEST_MYSQL_URL: mysql://root:c15t@127.0.0.1:3306/c15t
        run: bun turbo run test --filter=@c15t/backend
      - name: Summarize coverage
        if: ${{ !cancelled() }}
        run: bun scripts/coverage-summary.ts --require packages/backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: backend-test-reports
          path: packages/backend/coverage/
          retention-days: 7
      - uses: ./.github/actions/save-turbo-cache
        if: github.event_name != 'pull_request'
        with:
          scope: backend

  browser:
    permissions:
      contents: read
      id-token: write
    name: Browser integration (${{ matrix.integration.kind }}, Node ${{ matrix.node }})
    needs: [repository, build]
    if: needs.repository.outputs.integrations != '[]'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        integration: ${{ fromJSON(needs.repository.outputs.integrations) }}
    env:
      C15T_CI_NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          built: 'true'
          browsers: 'true'
          cache-scope: browser-${{ matrix.integration.kind }}
      - name: Run selected integration contracts
        env:
          CI_INTEGRATION: ${{ matrix.integration.kind }}
          CI_TARGETS: ${{ matrix.integration.targets }}
        run: bun scripts/ci-browser.ts
      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.integration.kind }}-node${{ matrix.node }}
          include-hidden-files: true
          path: |
            internals/fixtures/acceptance/artifacts/
            apps/parity-runner/playwright-report/
            apps/parity-runner/test-results/
            .ci-reports/
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/save-turbo-cache
        if: github.event_name != 'pull_request' && matrix.node == '24'
        with:
          scope: browser-${{ matrix.integration.kind }}

  bundle:
    permissions:
      contents: read
      id-token: write
    needs: [repository, build]
    if: needs.repository.outputs.bundle == 'true'
    uses: ./.github/workflows/bundle-analysis.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || needs.repository.outputs.baseRef || 'HEAD^' }}
      built: true

  performance:
    permissions:
      contents: read
      id-token: write
    needs: [repository, build]
    if: needs.repository.outputs.performance == 'true' && !inputs.skip_performance
    uses: ./.github/workflows/benchmark-regression.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
      built: true
      mode: ${{ github.event_name != 'pull_request' && 'full' || 'quick' }}

  complete:
    name: CI complete
    if: always()
    needs:
      [
        repository,
        build,
        types,
        packages,
        backend,
        browser,
        bundle,
        performance,
      ]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'depot-ubuntu-24.04-4' }}
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
