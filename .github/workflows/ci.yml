name: CI

on:
  pull_request:
    types: [opened, synchronize]
  workflow_call:

env:
  # The leadtype package-docs generation inside package builds exceeds Node's
  # default heap on cache-miss builds of the larger packages (core, react).
  NODE_OPTIONS: --max-old-space-size=6144
  # Pull-request checkouts are detached merge commits, so Turborepo cannot
  # resolve the base as a local branch even with full history. Track the PR's
  # real target so release PRs into `main` or `2.0.0` diff against the right
  # branch instead of always against `canary`.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/canary' }}

jobs:
  lint_and_check:
    name: 🧹 Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed for checkout
      checks: write # Needed for reviewdog to post results
      pull-requests: write # Needed for reviewdog github-pr-review reporter (optional)
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Read-only: the test job is the single writer of this cache (see below).
      - name: ♻️ Restore Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Deliberately not affected-scoped: this is the always-on cross-package
      # signal that catches breakage in packages a PR does not touch directly.
      - name: 👀 Type Check
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: bun turbo run check-types

      - name: 🧹 Run Biome with Reviewdog
        uses: mongolyy/reviewdog-action-biome@0b1d65ada95594f01240e84f09ba7b8723e5ff7d
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check # Report results as checks
          level: warning               # Report errors

  build:
    name: 🏗️ Build Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed for checkout
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Full history so Turborepo can resolve the base branch for --affected.
          fetch-depth: 0
          persist-credentials: false

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Read-only: the test job is the single writer of this cache (see below).
      - name: ♻️ Restore Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 🏗️ Build
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun turbo run build --filter="./packages/*" --affected
          else
            bun turbo run build --filter="./packages/*"
          fi

  test:
    name: 🧪 Run Tests & Coverage
    needs: build # Run only after build succeeds
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed for checkout
    steps:
      - name: ⬇️ Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Full history so Turborepo can resolve the base branch for --affected.
          fetch-depth: 0
          persist-credentials: false

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: 1.3.11

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      # Root repository tooling is not part of the package Turbo graph, so run
      # its focused tests on every CI event before installing browsers.
      - name: 🧰 Test repository scripts
        run: bun run test:scripts

      # This job is the single writer of the shared Turborepo cache: it builds
      # every package as a dependency of `test`, so its cache is the most
      # complete, and one writer means no concurrent-save conflicts.
      - name: ♻️ Restore Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 🎭 Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(bun -e "console.log(require('./package.json').devDependencies.playwright)")" >> "$GITHUB_OUTPUT"

      - name: 🎭 Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version rather than the lockfile hash —
          # browsers only change when Playwright does, and lockfile churn was
          # invalidating them on every unrelated dependency bump.
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: 🎭 Install Playwright browsers
        run: bunx "playwright@${{ steps.playwright.outputs.version }}" install --with-deps chromium chromium-headless-shell

      # Save immediately after installation so a later test failure does not
      # discard a successfully prepared browser cache.
      - name: 🎭 Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: 🧪 Run Tests
        env:
          TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun turbo run test --filter="./packages/*" --affected
          else
            bun turbo run test --filter="./packages/*"
          fi

      # Restored entries are carried into the next save, so the cache would
      # grow without bound across pushes and thrash the repo's 10GB budget.
      # Prune complete task entries to a 1 GiB ceiling. This runs on every event
      # so the script is exercised on PRs, but remains non-fatal because a prune
      # failure should only produce a larger cache, never failed product CI.
      - name: ♻️ Prune Turborepo cache
        continue-on-error: true
        run: bun scripts/prune-turbo-cache.ts

      # Written only from pushes to publishing branches. PR runs restore
      # read-only so they cannot churn the cache budget, matching the posture
      # for TURBO_TOKEN.
      - name: ♻️ Save Turborepo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

      - name: ⬆️ Upload Individual Coverage Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: individual-coverage-data # Artifact containing all raw reports
          path: |
            packages/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-final.json
            apps/*/coverage/coverage-summary.json
            apps/*/coverage/coverage-final.json
            # Add other potential locations if necessary
          retention-days: 7
          # Optional: Handle case where no files are found gracefully
          if-no-files-found: warn # 'warn', 'error', or 'ignore'
