name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=6144
  CI_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
  TURBO_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TURBO_TOKEN || '' }}
  TURBO_TEAM: ${{ github.event_name != 'pull_request' && secrets.TURBO_TEAM || '' }}

jobs:
  repository:
    name: Repository and docs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      packageChecks: ${{ steps.plan.outputs.packageChecks }}
      backend: ${{ steps.plan.outputs.backend }}
      integrations: ${{ steps.plan.outputs.integrations }}
      testBrowsers: ${{ steps.plan.outputs.testBrowsers }}
      bundle: ${{ steps.plan.outputs.bundle }}
      performance: ${{ steps.plan.outputs.performance }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select checks
        id: plan
        run: bun scripts/ci-plan.ts
      - name: Save selected checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-plan
          path: ci-plan.json
          retention-days: 1
          if-no-files-found: error
      - name: Lint
        run: bun oxlint . --format=github
      - name: Check formatting
        run: bun run fmt:check
      - name: Test repository tooling and docs contracts
        run: bun run test:scripts
      - name: Generate package documentation
        if: steps.plan.outputs.docs == 'true'
        run: bun turbo run build:docs

  build:
    name: Build packages once
    needs: repository
    if: needs.repository.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Read selected checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-plan
      - run: bun scripts/ci-run.ts build
      - name: Package same-run outputs and task cache
        run: bun scripts/ci-build-artifact.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-build
          path: ci-build.tar
          retention-days: 1
      - name: Prune shared cache
        if: github.event_name != 'pull_request'
        run: bun scripts/prune-turbo-cache.ts
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name != 'pull_request'
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  packages:
    name: Package behavior and types
    needs: [repository, build]
    if: ${{ !cancelled() && needs.repository.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.repository.outputs.packageChecks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          built: ${{ needs.build.result == 'success' }}
          browsers: ${{ needs.repository.outputs.testBrowsers }}
      - name: Read selected checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-plan
      - name: Check types
        run: bun scripts/ci-run.ts types
      - name: Check test types
        if: ${{ !cancelled() }}
        run: bun scripts/ci-run.ts testTypes
      - name: Run tests
        if: ${{ !cancelled() }}
        run: bun scripts/ci-run.ts tests
      - name: Summarize coverage
        if: ${{ !cancelled() }}
        run: bun scripts/coverage-summary.ts --plan ci-plan.json
      - name: Save coverage and test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-test-reports
          path: |
            packages/*/coverage/
            internals/*/coverage/
            apps/*/coverage/
            benchmarks/*/coverage/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Database behavior and migrations
    needs: [repository, build]
    if: needs.repository.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: c15t
          POSTGRES_DB: c15t
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: c15t
          MYSQL_DATABASE: c15t
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -uroot -pc15t --silent" --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          built: 'true'
      - name: Test every supported database
        env:
          C15T_TEST_PG_URL: postgres://postgres:c15t@127.0.0.1:5432/c15t
          C15T_TEST_MYSQL_URL: mysql://root:c15t@127.0.0.1:3306/c15t
        run: bun turbo run test --filter=@c15t/backend
      - name: Summarize coverage
        if: ${{ !cancelled() }}
        run: bun scripts/coverage-summary.ts --require packages/backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: backend-test-reports
          path: packages/backend/coverage/
          retention-days: 7

  browser:
    name: Browser integration (${{ matrix.kind }})
    needs: [repository, build]
    if: needs.repository.outputs.integrations != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.repository.outputs.integrations) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          built: 'true'
          browsers: 'true'
      - name: Run selected integration contracts
        env:
          CI_INTEGRATION: ${{ matrix.kind }}
          CI_TARGETS: ${{ matrix.targets }}
        run: bun scripts/ci-browser.ts
      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.kind }}
          include-hidden-files: true
          path: |
            examples/shared/artifacts/
            apps/parity-runner/playwright-report/
            apps/parity-runner/test-results/
            .ci-reports/
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    needs: [repository, build]
    if: needs.repository.outputs.bundle == 'true'
    uses: ./.github/workflows/bundle-analysis.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
      built: true

  performance:
    needs: [repository, build]
    if: needs.repository.outputs.performance == 'true'
    uses: ./.github/workflows/benchmark-regression.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
      built: true
      mode: ${{ github.event_name != 'pull_request' && 'full' || 'quick' }}

  complete:
    name: CI complete
    if: always()
    needs: [repository, build, packages, backend, browser, bundle, performance]
    runs-on: ubuntu-latest
    steps:
      - name: Check selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
