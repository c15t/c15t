name: Canary docs

# Redeploys canary.c15t.com after each push to canary.
#
# This repository holds no credential for the docs deploy. The job sends only
# its GitHub OIDC token to the Inth API, which checks that the token comes
# from this file on a push to canary in this repository before it starts the
# deploy. The deploy reads canary's tip itself, so nothing else is sent.
#
# The API matches this file's path, so renaming it stops the redeploys until
# the API's check is updated too.

on:
  push:
    branches: ['canary']

permissions: {}

concurrency:
  group: canary-docs
  cancel-in-progress: true

jobs:
  redeploy:
    name: Redeploy canary.c15t.com
    if: github.repository == 'c15t/c15t'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # mints the OIDC token the Inth API checks; nothing else
    steps:
      - name: Ask the docs deploy to rebuild canary
        env:
          AUDIENCE: inth-c15t-canary-docs
          RELAY_URL: https://api.inth.com/webhooks/c15t/canary-docs
        run: |
          set -euo pipefail
          token=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          curl -fsS --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $token" \
            "$RELAY_URL"
