org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The consent engine: true builds native/core-android as an included build, false
# resolves the published com.c15t artifacts at c15t.core.version. CI sets this to
# false once c15t-core ships to npm/Maven Central.
c15t.core.fromSource=true
c15t.core.group=com.c15t
c15t.core.version=3.0.0-alpha.1
c15t.core.sourceDir=../../../native/core-android

# Only auto and stub are supported, and in this standalone build both compile the
# compileOnly stand-in. codegen is rejected until a task actually runs RN's generator;
# see c15t-spec/build.gradle.kts.
c15t.spec.source=auto
# Override when node/react-native live somewhere Gradle cannot guess.
# c15t.nodeExecutable=node
# c15t.reactNativeDir=../../../node_modules/react-native
# The project Codegen reads package.json/node_modules from (default: the package root).
# c15t.codegenProjectRoot=.
c15t.reactNativeVersion=0.87.1

compileSdkVersion=36
minSdkVersion=24
