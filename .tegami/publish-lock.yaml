core:changelogs:
  - content: "---\npackages:\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/backend\":\n    type: minor\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Report who runs the backend as `window.c15t.hosting`\n\n`c15tInstance()` takes a `hosting` option, `'self-hosted'` by default or `'inth'` on Inth's platform. `/init` and `/manifest` report it, and the browser exposes it as `window.c15t.hosting` and the snapshot's `hosting`. It is not signed, so treat it as a debugging signal.\n"
    filename: 2026-10-07-backend-hosting.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/backend\":\n    type: patch\n---\n\n### Make hosted mode the default browser bundle\n\n`c15t.js` is the hosted script-tag bundle and requires a backend URL\nor a hosted transport factory. Use the new `c15t.offline.js` for browser-only\npolicy resolution. For manifest or custom mode with the stock UI, use the\n`@c15t/browser` ES module. The headless and IAB scripts still support those\nmodes.\n\nNew `@c15t/browser/hosted` and `@c15t/browser/offline` ES module entries keep\nthe stock UI and leave out code for other modes. Each rejects configuration\nfor another mode.\n\nThe self-hosted backend's `/c15t.js` route serves the hosted bundle with its\nbackend URL configured and resolves policies through `/init`.\n"
    filename: 2026-10-07-mode-specific-browser-bundles.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/dev-tools\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/ui\":\n    type: patch\n  c15t:\n    type: minor\n---\n\n### Open DevTools from the consent trigger toolbar\n\nWith `<ConsentDevTools>` mounted next to a visible `ConsentDialogTriggerToolbar`\nor `ConsentDialogTrigger`, the trigger shows a DevTools button and DevTools\nhides its floating launcher, so the two no longer overlap.\n`ConsentDialogTrigger` becomes a two-button toolbar. The panel opens beside the\ntoolbar and follows it when dragged. DevTools restores its own launcher when no\ntrigger is visible.\n\nFor hosts that render their own launcher, DevTools instances gain\n`dock(placement | null)` and `DevToolsState` reports the current `dock`.\n"
    filename: 2026-10-07-devtools-trigger-dock.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Support Nuxt 4.6 and Vue Vapor\n\n`@c15t/vue` lists `vue` `^3.5.39 || ^3.6.0-0` as a peer dependency, so it\ninstalls next to `vue@3.6.0-rc` without an `ERESOLVE` conflict. In Nuxt 4.6\napps with `vue.vapor` enabled, Vapor components can render `ConsentRoot`,\n`ConsentGate`, `ConsentWidget` and `ConsentPreferencesLink` and call the\ncomposables.\n\nOn Nuxt 4.6, `defineAppConfig()` type-checks the `c15t` key in `app.config.ts`\nagain. With `future.compatibilityVersion: 5`, the build no longer fails, but\n`ssr: false` pages get no early `/init` script and the browser starts the\nrequest when the app loads.\n"
    filename: 2026-10-06-vue-vapor.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Nuxt server routes follow `NUXT_PUBLIC_C15T_BACKEND_URL`\n\nSetting `NUXT_PUBLIC_C15T_BACKEND_URL` when a built Nuxt app starts moves the\nmodule's `/api/c15t/init` and `/api/c15t/manifest` routes to that backend too.\nBefore, those routes kept the build-time URL. `NUXT_PUBLIC_C15T_MANIFEST_URL`\nworks the same way.\n\nSet `NUXT_C15T_BACKEND_URL` or `NUXT_C15T_MANIFEST_URL` only when the routes\nshould reach the backend at an address the browser does not use, such as an\ninternal hostname.\n"
    filename: 2026-10-06-nuxt-runtime-backend-url.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/iab\":\n    type: minor\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  c15t:\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n---\n\n### Add IAB Global Privacy Platform support\n\nEvery framework can install the GPP 1.1 CMP API (`__gpp`) and keep its GPP\nstring in step with the visitor's choices.\n\n- React, Next.js and TanStack Start: render `ConsentGPP` from `@c15t/react/gpp`\n  (`c15t/react/gpp`) inside the consent provider or `ConsentRoot`.\n- Vue, Nuxt, Svelte, SvelteKit and Astro: set the `gpp` option. `gpp: true` uses\n  the defaults.\n- `@c15t/browser`: call `mountGPP(client)` from `@c15t/browser/gpp`, or load\n  `c15t.gpp.js` next to the main script tag.\n- `createConsentRuntime()` takes `gpp` with\n  `loadGPP: () => import('@c15t/iab/gpp')`, and `createGPP()` from\n  `@c15t/iab/gpp` mounts the API on any consent kernel.\n\nThe GPP code loads only when you use it.\n\nThe matched policy rule picks the section. An `iab` rule maps the TC String to\n`tcfeuv2`. A rule with the `preferences` or `opt-out` right gives US visitors\ntheir state section, or the US National section when the state is unknown or has\nnone. `usFallback: 'none'` turns that fallback off and `usApproach: 'national'`\nalways uses it. Indiana, Kentucky, Maryland and Rhode Island are not encoded yet\nand get the fallback.\n\nIf another CMP already owns `__gpp`, c15t leaves it in place. The `gpp` option\nreports the conflict to `onError`, `ConsentGPP` logs it, and `mountGPP()` and\n`createGPP()` throw.\n"
    filename: 2026-10-05-iab-gpp.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Open DevTools from the Vue consent trigger\n\nWith `ConsentDevTools` from `c15t/vue/devtools` mounted next to a visible\n`ConsentDialogTrigger`, the trigger becomes a two-button toolbar with a DevTools\nbutton, and DevTools hides its floating launcher. The panel opens beside the\ntoolbar and follows it when dragged. DevTools restores its own launcher when the\ntrigger is hidden. Style the toolbar with the `components.trigger.toolbar`,\n`toolbarItem` and `toolbarIcon` parts.\n"
    filename: 2026-10-07-devtools-trigger-dock-vue.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Closing the dialog brings back a banner the visitor still owes\n\nClosing preferences with Escape, `closeUI()` or `closeDialog()` left no banner\nand no dialog, even when the policy still required a choice. Closing the dialog\nleaves the same surface a save would. The banner returns while a choice or\nnotice is owed. `showConsentSurface(kernel, 'none')` follows the same rule while\nthe dialog is open.\n\n`useHeadlessIABConsentUI()` from `@c15t/react/iab` no longer flashes the banner\nwhile the TC string encodes. The Vue dialog no longer handles one Escape press\ntwice.\n"
    filename: 2026-10-06-dialog-close-returns-banner.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/iab\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Link IAB vendors to their privacy policies\n\nThe IAB preference dialog showed empty privacy policy links for every vendor\nbecause GVL v3 dropped the `policyUrl` field. The links now come from each\nvendor's `urls[]`, in the dialog's language with English as the fallback.\n\n`@c15t/iab/headless` exports `resolveIABVendorUrls(vendor, language)` for\ncustom preference UIs, and `processGVLForDialog` takes a `language`.\n"
    filename: 2026-10-06-iab-vendor-privacy-links.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/schema\":\n    type: patch\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/tanstack-start\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Generate consent manifests during application builds\n\nAdd opt-in build-time manifest snapshots for Next.js, TanStack Start, Astro,\nNuxt and Vite apps. Build plugins take `backendURL` and fetch its `/manifest`.\nServer helpers and consent routes resolve from the snapshot without fetching\nan upstream manifest. Geography, language, privacy signals and stored consent\nstill resolve per visitor.\n\nSnapshots stay fixed until the next build. Use runtime fetching for policy\nupdates that must apply without a rebuild. A manifest fetch failure or\ninvalid snapshot fails the build. Consent saves, session reports and IAB\nvendor lists still call the backend.\n\nSvelte's framework-free `resolveConsent` also accepts a snapshot. Both Svelte\nserver helpers take a background-work callback to keep session reports alive\non serverless hosts without `waitUntil`.\n\nNext.js runtime manifest requests use the App Router Data Cache with a\n300-second revalidation. `manifestRevalidateSeconds: false` skips that cache\ninstead of caching indefinitely.\n"
    filename: 2026-10-06-build-time-manifests.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/tanstack-start\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Export category, cleanup and policy types from the framework entries\n\nYou can type `consentCategories`, `clearOnRevocation` and\n`offline({ policyRules })` from the same import as the provider.\n\n- `c15t/react`, `c15t/next` and `c15t/tanstack-start` add `AllConsentNames`,\n  `ClearOnRevocationConfig`, `PolicyRule` and `policyRulePresets`.\n- `@c15t/svelte` adds `ClearOnRevocationConfig`, `PolicyRule` and\n  `policyRulePresets`.\n- `c15t/astro` adds `ClearOnRevocationConfig`.\n- `c15t/vue` adds `AllConsentNames` and `ClearOnRevocationConfig`.\n\nImporting them from `c15t` keeps working.\n"
    filename: 2026-10-06-framework-core-type-exports.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n  \"@c15t/cli\":\n    type: patch\n  \"@c15t/scripts\":\n    type: minor\n  \"@c15t/core\":\n    type: minor\n---\n\n### Add a Sentry integration\n\nAdd `sentry()` from `@c15t/integrations/sentry`, with CDN and app-managed SDK modes,\nCLI setup and the `@c15t/scripts/sentry` compatibility export. Errors run before\nconsent by default; Replay and SDK data collection wait for measurement.\n`loadMode: 'after-consent'` gates errors too.\n\nApply consent at initialization and before sending data. Withdrawal stops Replay\nwithout flushing pending recordings. Shared configurations coordinate consent and\nreuse the SDK bundle and recorder across renders.\n\nAdd core `Script.observeConsentBeforeLoad` and `Script.resourceKey`. Shared\nresources retain each registration's callbacks, consent and ownership, including\nregistrations that join after loading completes.\n"
    filename: 2026-10-05-sentry.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/translations\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Keep development warnings out of production builds\n\nDevelopment warnings, such as \"Vendor … has no declaration\", printed in\nproduction browser builds. They now read `process.env.NODE_ENV`, which\nbundlers replace at build time. Without a bundler or `process`, the warnings\nstill show.\n"
    filename: 2026-10-06-production-dev-warnings.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Build Next.js Pages Router apps without `transpilePackages`\n\nA Next.js app with only a `pages/` directory builds with c15t's stock dialog.\nBefore, webpack builds failed with \"Global CSS cannot be imported from within\nnode_modules\" unless the app set `transpilePackages`, and Turbopack failed on\nlinked installs.\n\n`styles.css` includes the preference dialog and widget rules again, and no\n`@c15t/react` or `@c15t/ui` module imports CSS. The render-blocking stylesheet\ngrows by about 4.5 kB gzip.\n\n`@c15t/ui/styles/dialog.css`, the `@c15t/ui/styles/dialog` module and\n`c15t/astro/dialog.css` are now empty. They still resolve, so existing imports\nkeep building. Remove them.\n"
    filename: 2026-10-06-dialog-rules-in-styles-css.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/nextjs\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n---\n\n### `ConsentRoot` starts consented scripts sooner\n\nIn Next.js and TanStack Start, `ConsentRoot` starts downloading the script\nloader during its first render when stored consent already allows one of its\n`scripts`, instead of after hydration. There is nothing to configure.\n"
    filename: 2026-10-06-next-script-loader-early.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Switches follow the theme's primary color\n\nThe active switch track defaults to the primary color, in the light and dark\npalettes and in a stylesheet that sets `--c15t-primary` directly. Before, a\ntheme that set `colors.primary` without `colors.switchTrackActive` kept the\nswitches blue. Set `colors.switchTrackActive` or `--c15t-switch-track-active`\nfor a different color. The default theme looks the same.\n"
    filename: 2026-10-06-switch-follows-primary.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/core\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### `ConsentProvider` requests `/init` sooner\n\nIn a client render, `ConsentProvider` with `hosted()` and no `prefetch` sends\n`/init` during its first render instead of after mount, so the banner shows\nsooner (about 38 ms on a throttled mobile profile). Server renders, hydration\nand apps with a `prefetch` or `ConsentRoot` keep the previous timing.\n"
    filename: 2026-10-06-react-early-init.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/cli\":\n    type: minor\n---\n\n### Add codemods for the rest of the v2 to v3 upgrade\n\n`c15t codemods` gains eleven v3 transforms. Each runs only when you name it.\n\n- `consent-provider-options` renames `ConsentManagerProvider` to\n  `ConsentProvider` and moves its options to `hosted()`,\n  `offline({ policyRules })` and `iframeBlocker`.\n- `root-exports-to-subpaths` moves imports that left the `c15t/react` and\n  `c15t/next` roots to their subpaths.\n- `dev-tools-to-c15t` points `@c15t/dev-tools/react` and `/tanstack` at\n  `c15t/next/devtools` or `c15t/react/devtools`.\n- `policy-packs-to-policy-rules` renames `policyPackPresets` to\n  `policyRulePresets` and `worldNoBanner()` to `worldOptOutNoPrompt()`.\n- `css-variables-to-v3` renames `--consent-widget-*` and `--frame-*`.\n- `postcss-tailwind3` adds the c15t plugin before `tailwindcss` in an\n  object-form `postcss.config`.\n- `callbacks-to-v3`, `theme-to-consent-theme` and `iab-option-to-iab-provider`\n  rename what they can and mark the rest for manual work.\n- `node-sdk-to-v3` moves `@c15t/node-sdk` code to `createC15tClient()`.\n- `backend-config-to-v3` moves `policyPacks`, `branding`, `customTranslations`,\n  `i18n` and `appName` under `manifest`.\n\nWhere a change needs a decision, the codemods leave a `TODO(c15t v3)` comment,\nand most keep the v2 code so type-checking fails until you finish. Run them with\n`--dry-run --json` first to review.\n"
    filename: 2026-10-07-v3-codemods.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Warn when an experiment's banner asks about no category\n\nWhen an experiment arm's banner runs under a policy that asks about no optional\ncategory, accepting or rejecting records only a notice acknowledgement.\n`onChoiceRecorded` never fires and the experiment counts impressions only. This\nhappens under a permissive rule when the site declares no categories through\n`consentCategories`, `scripts` or `vendors`. c15t logs a warning outside\nproduction the first time it happens.\n"
    filename: 2026-10-06-experiment-no-categories-warning.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Add `ExperimentArmName` for typing a flag's arm\n\n`ExperimentArmName<typeof experiment>` is `'control'` plus the arm names of an\nexperiment built with `defineExperiment()`. Use it to check a feature flag's\nvalue before passing it as `arm`. Import it from `c15t`.\n"
    filename: 2026-10-06-experiment-arm-name.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n---\n\n### Report a spent request budget as 0 ms\n\nWhen a consent route's `x-c15t-timeout-ms` budget ran out before the manifest\ncache or consent resolution started, the timeout error named a negative\nduration, such as \"no manifest within -3 ms\". It now says 0 ms. Timing is\nunchanged: a spent budget already gave up at once.\n"
    filename: 2026-10-07-spent-budget-timeout-message.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/translations\":\n    type: minor\n---\n\n### Import one language at a time\n\nEvery bundled language has its own entry point, such as\n`@c15t/translations/de` or `@c15t/translations/fr`. Importing one registers\nc15t's built-in copy for that language without loading the others. Each entry\nalso exports the copy as `translations`. `@c15t/translations/all` still loads\nthem all.\n"
    filename: 2026-10-06-per-language-translations.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: minor\n---\n\n### Open DevTools from the Svelte consent trigger\n\nWhen `ConsentDevTools` is mounted next to a visible `ConsentDialogTrigger`, the\ntrigger gains a DevTools button and DevTools hides its floating launcher, so\nthe two no longer overlap. The panel opens beside the trigger and follows it\nwhen dragged. The launcher returns whenever no trigger is visible.\n"
    filename: 2026-10-07-devtools-trigger-dock-svelte.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: minor\n---\n\n### Open DevTools from the script-tag consent trigger\n\nWhen DevTools is mounted next to the stock floating trigger, through\n`mountDevTools` or the `c15t.devtools.js` tag, the trigger becomes a toolbar\nwith a DevTools button and DevTools hides its own launcher. The panel opens\nbeside the toolbar and follows it when dragged. The tags can load in either\norder.\n"
    filename: 2026-10-07-devtools-trigger-dock-browser.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/iab\":\n    type: patch\n---\n\n### Stop reporting tcloaded before the visitor chooses\n\nOn a first visit, `__tcfapi('addEventListener')` reported `tcloaded` with an\nempty TC string while the banner showed, so an ad tag that trusts `tcloaded`\ncould start before the visitor chose. The CMP API now follows the TCF CMP API\nv2 event rules:\n\n- While the banner or dialog is open, listeners get `cmpuishown`, then\n  `useractioncomplete` for the choice.\n- `tcloaded` means a TC string is available and no UI is showing, or GDPR\n  does not apply.\n- Listeners hear about changes only. A withdrawn string arrives with no event\n  status.\n"
    filename: 2026-10-06-iab-tcf-event-status.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/iab\":\n    type: patch\n---\n\n### Show saved IAB choices in the preference dialog after a reload\n\nA returning visitor who opened the IAB preference dialog saw every switch off,\neven though `__tcfapi` reported their saved consent, and pressing Save revoked\neverything. The dialog starts from the stored TC string in every framework and\nin `@c15t/browser`.\n"
    filename: 2026-10-06-iab-restore-selections.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/iab\":\n    type: major\n---\n\n### Accept All consents only to purposes your vendors declare\n\nUnder an IAB policy, Accept All used to consent to all 11 TCF purposes and every\nspecial feature, including ones no listed vendor declares. Accept All sets\nconsent, legitimate interest and special feature opt-ins only for what your\nvendors declare, as the TCF Policies require.\n\nThis can change which c15t categories Accept All grants. A category whose\npurposes no listed vendor declares stays denied: `experience` (purposes 5 and\n6), `functionality` (10 and 11), `measurement` (7 to 9) or `marketing` (2 to 4).\nScripts, iframes and network rules gated on it no longer load after Accept All.\n\nTo check, click Accept All on a fresh visit and read `effectivePermissions`. If\na category your scripts need stays denied, declare that processing as a custom\nvendor through `customVendors`, or gate the script on a category your vendors\ncover. See \"Categories under an IAB policy\" in the consent state reference.\n"
    filename: 2026-10-06-iab-accept-all-declared-purposes.md
    v: 0.0.0
