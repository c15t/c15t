core:changelogs:
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n  \"@c15t/cli\":\n    type: patch\n  \"@c15t/scripts\":\n    type: minor\n  \"@c15t/core\":\n    type: minor\n---\n\n### Add a Sentry integration\n\nAdd `sentry()` from `@c15t/integrations/sentry`, with CDN and app-managed SDK modes,\nCLI setup and the `@c15t/scripts/sentry` compatibility export. Errors run before\nconsent by default; Replay and SDK data collection wait for measurement.\n`loadMode: 'after-consent'` gates errors too.\n\nApply consent at initialization and before sending data. Withdrawal stops Replay\nwithout flushing pending recordings. Shared configurations coordinate consent and\nreuse the SDK bundle and recorder across renders.\n\nAdd core `Script.observeConsentBeforeLoad` and `Script.resourceKey`. Shared\nresources retain each registration's callbacks, consent and ownership, including\nregistrations that join after loading completes.\n"
    filename: 2026-10-05-sentry.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: patch\n  \"@c15t/core\":\n    type: patch\n---\n\n### Stop the first vendor helper call from loading the ICU collator\n\nIntegration helpers such as `googleTagManager()` and `metaPixel()` built their\nmanifest cache key by sorting config keys with `localeCompare`. The first\n`localeCompare` call in a page makes the browser set up its collator, so a page\nthat had not compared strings yet paid for it on the first helper call. The\ncache key now sorts keys with a plain comparison.\n\nThe preference draft's vendor list sort had the same problem. It now uses\n`compareCanonical` like the rest of core, so mounting a preference center no\nlonger loads the collator either.\n\nIn headless Chromium with 4x CPU throttling, a page that calls the GTM, GA4 and\nMeta Pixel helpers spends about 30 ms less on the main thread during load.\n"
    filename: 2026-10-08-integrations-cache-key-collator.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Keep a Nuxt `manifestSnapshot` intact\n\nA `manifestSnapshot` set under the `c15t` key in `nuxt.config.ts` passed\nthrough public runtime config. Nitro replaces every `null` there with an empty\nstring during the build, so each policy failed validation and no banner\nshowed. The snapshot was also sent in every page's payload.\n\nThe module now keeps it out of runtime config. The app bundles it unchanged,\nand the server's `/api/c15t/manifest` route serves it wherever the module\nregisters that route: in server manifest mode, and in client mode without a\n`manifestURL`.\n"
    filename: 2026-10-08-nuxt-manifest-snapshot-option.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Show the Nuxt banner with `buildManifest: true`\n\nWith `buildManifest: true`, Nuxt showed no banner to any visitor. The module\nstored the build-time manifest in runtime config, where Nitro replaces every\n`null` with an empty string during the build. Each policy's `copyRevision: null`\nbecame `''`, so every policy failed with `invalid-configuration`.\n\nThe snapshot now ships in the server bundle unchanged, and the\n`/api/c15t/init` and `/api/c15t/manifest` routes read it from there.\n"
    filename: 2026-10-08-nuxt-build-manifest-nulls.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Respect `colorScheme: null` in built Nuxt apps\n\n`colorScheme: null` under the `c15t` key in `nuxt.config.ts` leaves\n`c15t-dark` to your site. That held in tests but not in built apps: Nitro\nreplaces every `null` in runtime config with an empty string during the build,\nand c15t read the empty string as unset. It then copied the site's `dark` class\ninto `c15t-dark`, removing a `c15t-dark` the site had set itself. The module\nnow reads the empty string as `null`.\n"
    filename: 2026-10-08-nuxt-color-scheme-null.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: minor\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Show the consent banner at once, and fade it in only when it arrives late\n\nThe banner and the IAB banner no longer slide or scale in on a spring curve.\nA banner that shows with the page is part of the first paint, where the\novershoot read as layout shift, so it now appears on its first frame. The\nbackdrop of a blocking banner appears with it.\n\nA banner that arrives more than 100ms after the page first painted, such as\nafter a slow script or a client-side init, fades in instead of popping into a\npage someone is already reading. It fades over `--c15t-duration-normal` on\n`--c15t-easing-out` and never moves. Its root and backdrop carry\n`data-entry=\"late\"`, and `--consent-banner-entry-duration` and\n`--consent-banner-entry-timing` (`--iab-consent-banner-entry-*` for the IAB\nbanner) set the fade. A banner rendered on the server always shows at once.\n`@c15t/ui/utils/late-entry` exports the check as `isLateEntry`.\n\nHiding still fades the banner out where it did before, now without the slide\nor scale, and on an ease-in curve so it speeds up as it leaves.\n`disableAnimation` turns both fades off.\n\nAdd the `--c15t-easing-in` theme token, set with `motion.easingIn`. It defaults\nto `cubic-bezier(0.55, 0.055, 0.675, 0.19)` and sets the banner's exit curve.\n"
    filename: 2026-10-08-banner-entry-motion.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/backend\":\n    type: minor\n  \"@c15t/node-sdk\":\n    type: minor\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/core\":\n    type: minor\n---\n\n### Verified identity links\n\n`GET /subjects?externalId=` and `GET /consents/check` now count only verified links between a subject and your user ID. A link is verified by an API key, or by an `identityToken` from `createIdentityToken` in `@c15t/node-sdk`, passed to `identify({ externalId, identityToken })` and checked against the new `identityToken.signingKey` option.\n\n- `GET /consents/check` requires an API key, so `consents.check` moves to the node-sdk client created with `apiKey`.\n- Existing links, including those made by v2, stay unverified until relinked.\n- Migration 8 adds `subject.verifiedExternalId`.\n"
    filename: 2026-10-08-verified-identity-links.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n---\n\n### Report failed and dropped consent saves\n\nDevelopment builds log a `[c15t]` warning when a save is queued for retry, a\nreplay fails, or a save is dropped. A queued save dropped after 10 attempts,\n7 days or a refusal now reaches `onError`.\n"
    filename: 2026-10-08-warn-failed-consent-saves.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/nextjs\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Share Next.js consent options with `ConsentManifestOptions`\n\nPass one options object to `resolveConsent` and the consent route handlers, so\nboth use the same build-time snapshot:\n\n```ts\nexport const consentOptions = {\n\tconfig: consentConfig,\n\tmanifest: consentManifest,\n} satisfies ConsentManifestOptions;\n```\n\n`createNextConsentRouteHandlers` and `createPagesApiHandlers` now accept\n`config`.\n"
    filename: 2026-10-07-next-consent-manifest-options.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/tanstack-start\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Share TanStack Start consent options with `ConsentManifestOptions`\n\nPass one options object to `createConsentStateHandler` and\n`createConsentServerRoute`, so both use the same build-time snapshot:\n\n```ts\nexport const consentOptions = {\n\tbackendURL: 'https://your-project.inth.app',\n\tmanifest: consentManifest,\n} satisfies ConsentManifestOptions;\n```\n"
    filename: 2026-10-07-tanstack-consent-manifest-options.md
    v: 0.0.0
