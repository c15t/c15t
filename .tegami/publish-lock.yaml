  - content: "---\npackages:\n  \"@c15t/backend\":\n    type: minor\n  \"@c15t/cli\":\n    type: minor\n---\n\n### Stop bundling docs in `@c15t/backend` and `@c15t/cli`\n\nThe packages no longer ship `docs/`, `AGENTS.md` or `SKILL.md`. These Markdown\nfiles added size to every install and deploy without being read at runtime.\nRead the docs at [c15t.com/docs](https://c15t.com/docs) or through\n[llms.txt](https://c15t.com/docs/llms.txt).\n"
    filename: 2026-10-29-drop-bundled-package-docs.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/backend\":\n    type: patch\n---\n\n### Accept consent saves from clocks a little ahead of the server\n\n`POST /subjects` refused a save with 400 `INPUT_VALIDATION_FAILED` when\n`givenAt`, a category receipt's `confirmedAt` or `vendorChoice.confirmedAt` was\nlater than the backend's clock by any amount. A visitor whose clock ran a few\nhundred milliseconds ahead lost the live save, and the backend held no record\nunless the visitor loaded another page. The backend now accepts these times up\nto ten minutes ahead, the same tolerance it allows a replayed save, and records\nthem as sent. A time further ahead is still refused.\n"
    filename: 2026-10-27-client-clock-tolerance.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/backend\":\n    replay:\n      - exit-prerelease(npm:@c15t/backend)\n---\n\n### Record the tenant on identity-link audit entries\n\nOn an instance configured with a `tenantId`, `PATCH /subjects/:id` wrote its\n`identify_user` audit entry with a NULL tenant, while the subject and the\n`consent_given` entry carried the configured one. Identity-link entries now\ncarry the tenant too. Entries written before this fix keep a NULL tenant; their\nsubject's `tenantId` identifies the tenant they belong to.\n"
    filename: 2026-10-19-identify-user-audit-tenant.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/backend\":\n    replay:\n      - exit-prerelease(npm:@c15t/backend)\n---\n\n### Validate identity links before writing, and skip repeated links\n\n`PATCH /subjects/:id` now checks that `externalId` and `identityProvider` are\nstrings before it writes anything. Other values get a 400 with\n`INPUT_VALIDATION_FAILED`. Before, a number or an object could create the\nsubject and then fail the link, with a misleading 409 or a 500, or store the\nvalue as text such as `\"[object Object]\"`.\n\nCreating a subject and linking it now happen in one transaction. A link the\ndatabase rejects leaves no subject behind.\n\nA link that matches the stored identity, provider and verification state writes\nnothing, so client retries no longer add an `identify_user` audit entry each\ntime. A link that verifies the identity or changes the provider is still stored\nand audited.\n"
    filename: 2026-10-22-identity-link-validation.md
    v: 0.0.0
  - content: "---\npackages:\n  c15t:\n    replay:\n      - exit-prerelease(npm:c15t)\n  \"@c15t/cli\":\n    replay:\n      - exit-prerelease(npm:@c15t/cli)\n  \"@c15t/svelte\":\n    replay:\n      - exit-prerelease(npm:@c15t/svelte)\n---\n\n### Install Svelte and SvelteKit through c15t\n\nUse `c15t/svelte` for Svelte components and consent modes, with SvelteKit\nhelpers at `c15t/svelte/kit`, server resolution at `c15t/svelte/server` and\nthe Vite plugin at `c15t/svelte/vite`. The package also includes headless\nAPIs, dev tools, locals types and stylesheets. Svelte and SvelteKit docs now\ninstall `c15t` and use these imports.\n\nThe CLI now installs `c15t` and generates `c15t/svelte` imports for Svelte\nand SvelteKit. Runtime setup errors recommend the same import paths.\n"
    filename: 2026-10-20-svelte-umbrella-exports.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n---\n\n### Record Databuddy sessions with the `replay` option\n\n`databuddy({ clientId: 'YOUR_CLIENT_ID', replay: true })` loads Databuddy's\nsession replay recorder, `replay.js`, while measurement is allowed. Recordings\nmask page text and typed input. Pass `replay: { maskText: false }` to record\npage text on pages that show no personal data, or `recordIframes: true` to\nrecord your own embedded pages. On revocation the helper calls\n`window.databuddyReplay.stop()` and removes the script, so recording stops\nwithout waiting for a page reload.\nRemove any `replay.js` script you registered yourself. See the\n[Databuddy guide](https://c15t.com/docs/integrations/databuddy).\n"
    filename: 2026-10-26-databuddy-replay.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n---\n\n### Load Databuddy after consent and turn off features you do not use\n\n`databuddy()` now waits for `measurement` consent before it loads\n`databuddy.js`, like most c15t analytics helpers. Until the visitor allows\nmeasurement, the page makes no request to Databuddy and Databuddy stores\nnothing in the browser. Pass `loadMode: 'always'` to keep loading Databuddy on\nevery page, as before.\n\nNew `features` switches turn Databuddy's interaction tracking, Web Vitals,\nerror tracking and outgoing link tracking on or off. `configWhenGranted` and\n`configWhenDenied` are now optional.\n\nThe guide also shows how to load Databuddy's session replay script only with\nmeasurement consent. See the\n[Databuddy guide](https://c15t.com/docs/integrations/databuddy).\n"
    filename: 2026-10-24-databuddy-after-consent.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    replay:\n      - exit-prerelease(npm:@c15t/integrations)\n---\n\n### Send c15t consent to Shopify\n\n`@c15t/integrations/shopify` adds `createShopifyCustomerPrivacy`, a bridge that\nsends each c15t choice to Shopify's Customer Privacy API. Pass its `setup` to\nHydrogen's `ShopifyScripts` with `consent: { mode: 'custom-banner' }`, and\nHydrogen holds analytics events until the visitor has answered the c15t\nbanner. Under an opt-out policy, Shopify applies its region defaults until the\nvisitor saves a choice. See the\n[Shopify guide](https://c15t.com/docs/integrations/shopify).\n"
    filename: 2026-10-16-shopify-customer-privacy.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    replay:\n      - exit-prerelease(npm:@c15t/core)\n  \"@c15t/node-sdk\":\n    replay:\n      - exit-prerelease(npm:@c15t/node-sdk)\n---\n\n### Errors say what the backend said\n\nWhen a backend refuses a request with a JSON body, the error now carries its\nmessage and code. Over HTTP/2 an error used to read\n`c15t hosted transport: /init responded 402 ` with nothing after the status.\nIt now reads\n`c15t hosted transport: /init responded 402: <message> (<CODE>)` and has\n`status` and `code` properties. Bodies that are not JSON keep the old message.\nThis covers `/init`, `/manifest`, `/subjects`, the manifest cache, the static\nmanifest and the GVL. The dev warning for a failed init now includes the\nmessage too.\n\nA consent save refused with 402 (payment required) is no longer resent. The\nchoice stays in the browser, as it does for other permanent rejections. A 402\non init is not retried. A 409 or 422 save is also no longer resent when its\npermanent code, such as `SUBJECT_CONFLICT`, is at the top level of the body\ninstead of under `cause`.\n\n`@c15t/node-sdk` now reads a top-level `code` when the body has no\n`cause.code`, so `serverCode` is set for `{ message, code }` bodies.\n"
    filename: 2026-10-20-backend-error-messages.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Connect the consent panel in Nuxt DevTools popup windows\n\nLet the c15t tab find the app's consent provider through a popup opener or\npast a cross-origin DevTools frame. This keeps the panel connected to the\napp's consent state in Nuxt DevTools 4 while preserving Nuxt 3 and 4 support.\n"
    filename: 2026-10-28-nuxt-devtools-4.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    replay:\n      - exit-prerelease(npm:@c15t/astro)\n  c15t:\n    replay:\n      - exit-prerelease(npm:c15t)\n---\n\n### Diagnose slow Astro consent setup\n\nAdd troubleshooting guidance for Astro 7.4's build timing report. Explain\nwhere to find c15t's setup hook duration, how it includes manifest loading,\nand how to investigate a slow build-time manifest request.\n"
    filename: 2026-10-17-astro-build-timings.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Dialog close-button offset and trigger labels follow the text size\n\nThe consent dialog's close-button offset and the dialog trigger's small and\nlarge labels now use `rem`, so they scale with the visitor's text-size setting\nlike the rest of the dialog. At the default 16px root they render exactly as\nbefore.\n"
    filename: 2026-10-25-rem-text-sizes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: minor\n---\n\n### Keep fixed elements still while a blocking surface locks scrolling\n\nWhen a blocking banner or the preference dialog locks page scrolling and no\n`scrollbar-gutter` holds the scrollbar's space, c15t pads `<body>` instead.\nThat happens in browsers without `scrollbar-gutter`, and in Chromium on macOS\non pages that style their scrollbar with `::-webkit-scrollbar`. The padding\nkeeps page content still, but `position: fixed` elements moved right by the\nscrollbar's width.\n\nWhile it pads `<body>`, the lock now sets `--c15t-scroll-lock-gap` on `<html>`\nto the same width. Use it to keep your fixed elements still:\n\n```css\n.chat-button {\n  right: calc(1rem + var(--c15t-scroll-lock-gap, 0px));\n}\n```\n\nThe padding and the variable now also account for CSS `zoom` on `<html>` or\n`<body>`, in browsers with `Element.currentCSSZoom`. Before, `html { zoom: 2 }`\ndoubled the padding, so page content moved left by the scrollbar's width while\nthe lock held. Browsers without `currentCSSZoom` behave as before.\n"
    filename: 2026-10-25-scroll-lock-gap.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    replay:\n      - exit-prerelease(npm:@c15t/ui)\n---\n\n### Yiddish and other right-to-left languages render right to left\n\nBanners, dialogs and preference centers now set `dir=\"rtl\"` for Yiddish\n(`yi`), Central Kurdish (`ckb`), Uyghur (`ug`), Syriac (`syr`) and N'Ko\n(`nqo`), and for the older codes `iw` (Hebrew) and `ji` (Yiddish). They\nrendered left to right before.\n\nA script subtag now decides the direction over the language: `ku-Arab`,\n`pa-Arab` and `az-Arab` are right to left, and `sd-Deva` is left to right.\n\nPlain `ku` is now left to right. It usually means Kurmanji, which uses\nLatin script. For Sorani, use `ckb` or `ku-Arab`.\n"
    filename: 2026-10-21-rtl-languages.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n---\n\n### Explain consent evidence in the local-mode warning\n\nThe development warning now explains that GDPR Article 7(1) requires businesses\nrelying on consent to demonstrate it. Local mode keeps choices only in the\nbrowser, so keep your own consent records or use a c15t backend.\n"
    filename: 2026-10-28-local-mode-consent-evidence.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    replay:\n      - exit-prerelease(npm:@c15t/core)\n---\n\n### Browser manifest mode skips the manifest request when the server state has a policy\n\nWith `manifest({ resolve: 'browser' })`, the browser used to request\n`/manifest` and load the policy resolver (about 20 KB gzipped) on every page\nload, even when the server state from `resolveConsent()` already held the\nvisitor's policy and the browser never used them. Now neither starts until an\ninit needs them. With a streamed state, they start once it arrives without a\npolicy.\n"
    filename: 2026-10-15-skip-unused-manifest-request.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    replay:\n      - exit-prerelease(npm:@c15t/core)\n---\n\n### Keep the subject ID with a notice acknowledgement\n\nEvery notice acknowledgement now stores the visitor's subject ID with it, in a\nnew `<storageKey>-notice-subject` cookie (`c15t-notice-subject` by default).\nThat includes a choice that acknowledges a notice. A visitor whose only action\nwas acknowledging a banner that offers only necessary categories keeps their ID\nthrough this record. The acknowledgement still grants no optional category. The\n`<storageKey>-notice` cookie keeps its old format, so an older c15t runtime on\nthe same site still reads it.\n\n`clear()` removes the acknowledgement and its `-notice-subject` cookie. The\nvisitor keeps their subject ID in `<storageKey>-sid`, as after any other clear.\n`kernel.set.subjectId(null)` gives the visitor a new ID in both places.\n\n`clearOnRevocation` patterns never delete the notice identity cookie, even when a\nwildcard matches its name.\n\nA save that records only vendor decisions while a notice is shown, such as\nturning off a vendor switch, now stores the notice acknowledgement too, so a\nreload no longer shows the notice again.\n\nNotice acknowledgements stored in localStorage keep their linked account when\ncookies cannot be read.\n\nWhen the consent record cannot be read, a tab now follows another tab's change\nof the subject ID that a notice or vendor record carries, instead of keeping\nthe old ID and saving it later.\n\nA tab drops a linked account when an older c15t runtime removes or replaces\nthe notice acknowledgement that carried it. The subject ID stays.\n\nA seed from a backend keeps the linked account it names for a stored ID. A tab\nfollows another tab's linked account on the record that gave its own.\n\nA save under a subject ID or linked account with no URI encoding, such as\none with a lone surrogate, keeps the whole record in localStorage and skips\nits cookie copy instead of throwing. A tab follows the notice's subject once\nthe vendor record that carried another is removed or loses its subject.\n\nThe `StoredRecords` type exported from `@c15t/core/modules/persistence` gains\noptional `recordedSubjectId` and `subjectCarrier` fields. An object typed as\n`StoredRecords` with the earlier fields still type-checks. `readStoredRecords()`\nalways sets both, and its return type says so. A stand-in typed through the\nreader, such as `typeof readStoredRecords`, its return type or a mocked\nreader, must now return both fields.\n\nIf your cookie policy lists c15t cookies, add `c15t-notice-subject`.\n"
    filename: 2026-10-21-necessary-only-subject.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    replay:\n      - exit-prerelease(npm:@c15t/core)\n---\n\n### The IAB CMP is created once under an IAB policy\n\nWhen an IAB policy supplied the `cmpId` after the runtime started, the IAB\nCMP was created up to 100 times on every page load, and the console showed\n\"Consent listeners kept updating consent in response to each other\".\n`createIAB` updates the kernel while it runs, and that update started the\nmount again before the first CMP was stored. Now the CMP is created once.\n"
    filename: 2026-10-20-iab-mount-reentry.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    replay:\n      - exit-prerelease(npm:@c15t/core)\n---\n\n### Keep a dialog open when consent init resolves\n\nA preference center opened before the consent backend answered closed when\nthe answer arrived, for example when a visitor clicked a consent gate's\nbutton right after the page loaded. The dialog now stays open until the\nvisitor saves or closes it.\n"
    filename: 2026-10-13-dialog-open-during-init.md
    v: 0.0.0
