core:changelogs:
  - content: "---\npackages:\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/backend\":\n    type: minor\n  \"@c15t/tanstack-start\":\n    type: minor\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/dev-tools\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Count each experiment arm's visitors through `/init`\n\nThe backend now learns which arm a visitor runs before they choose, so a dashboard can compute an opt-in rate per arm without any analytics setup. While a visitor has no stored choice, `/init` carries their arm in an `x-c15t-experiment: <id>=<arm>` header, and the backend adds `experiment: { id, arm }` to that request's session report. Manifest-mode renders and init routes put it on the report they send to `POST /sessions`. A visitor who already chose is not counted, because they are not shown the banner.\n\nOn a server-rendered page, pass the experiment with the visitor's arm to `resolveConsent({ experiment: { ...bannerShape, arm } })` in `c15t/next`, `@c15t/tanstack-start` and `@c15t/svelte`. The server sends only `{ id, arm }` to the backend, and the returned state carries the experiment to the client, so the provider needs no `experiment` option of its own. A streamed (unawaited) state arrives after the provider mounts, so pass the experiment to the client too; the provider warns in development when you forget. Astro and Nuxt send the arm they rendered on their own. `@c15t/schema` exports `CONSENT_EXPERIMENT_HEADER`, `formatExperimentHeader` and `parseExperimentHeader`, and the session report schema gains an optional `experiment`.\n\nThe `choice:recorded` kernel event and `onChoiceRecorded` payload now include `uiSource` and `consentAction`, and `onSurfaceShown` and `onChoiceRecorded` carry the arm, so forwarding experiment events to GTM, PostHog or any other tool is one callback.\n\nOpt-out experiments are measurable too. The `notice:dismissed` kernel event now carries `surface`, `timeToDecisionMs` and `experiment`. The surface is the snapshot's `activeUI`, so a programmatic `dismissNotice()` with no prompt open reports `surface: 'none'` and no timing, the same as a programmatic `save()`.\n\nDev-tools show the assigned experiment arm and the first impression time of each surface on the Policy tab.\n"
    filename: 2026-09-29-experiment-reporting.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/dev-tools\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### A/B test banner presentation with any flag provider\n\nAdd an `experiment` option for A/B tests on banner and preferences presentation. Your `presentation` is the `control` arm; `arms` lists what every other arm changes. Pass the `arm` your feature flag resolved (Vercel Flags, PostHog, LaunchDarkly, GrowthBook, Statsig), or a `split` such as `{ control: 60, wall: 40 }` for c15t to pick. `defineExperiment()` infers the arm names, so a misspelled `arm` or `split` key is a type error.\n\n```ts\nexperiment: {\n  id: 'banner-shape',\n  arms: { wall: { prompt: { variant: 'wall' } } },\n  arm: flagValue, // or split: { control: 60, wall: 40 }\n}\n```\n\nThe arm is merged over `presentation` and exposed as `snapshot.experiment` (React and Vue `useExperiment()`, Svelte `state.experiment`, browser `client.presentation`). It rides on `surface:shown` and `choice:recorded` and is saved with the choice as `metadata.experiment`, but only once the banner has shown it in the current page. A returning visitor who changes their choice from a footer link is not counted toward an arm they never saw.\n\nWhen c15t picks the arm, it does so when the page starts, before `/init`, and holds the banner until the arm is checked, so the visitor never sees one banner swap for another; on a server-rendered page the banner appears after hydration. The arm is stored as `{ id, arm }` under `c15t-experiment-v1` once the banner has shown it. Nothing is stored for a visitor who is never prompted or for an arm from your flag, and no identifier is stored.\n\nArm validation loads as its own chunk, only when `experiment` is set, so a site without an experiment ships none of it. It is also exported from `c15t/experiment`, where `validateExperiment()` lets a test fail a build on a rejected arm.\n\nNothing in the experiment throws into the page. An undeclared `arm` or an unusable `split` logs an error and runs no experiment. An arm that trips a presentation diagnostic under the visitor's policy is not shown to that visitor, who sees `control` and is not counted, unless `acknowledgeDiagnostics: true`, which is recorded with the arm.\n\n`@c15t/astro` resolves the arm on the server: per request through `consentMiddleware({ experimentArm })` from `@c15t/astro/middleware` with `middleware: false`, or one fixed `arm`. Arms vary presentation and theme, not copy.\n\nAn arm can also carry `theme` overrides (`arms: { bold: { theme: { colors: { primary: '#0a0a0a' } } } }`), merged one token group deep over the host `theme`. Read the merged theme with React `useResolvedTheme()`, Vue `useResolvedTheme(theme)`, Svelte `getConsentManager().theme` and browser `client.theme`. In React, render its tokens with `<ConsentTheme theme={useResolvedTheme()} />`.\n"
    filename: 2026-09-29-banner-experiments.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/dev-tools\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Report banner impressions and time to decision\n\nReport banner and dialog impressions, not only choices. The kernel emits a `surface:shown` event when the banner or the dialog becomes visible and records the first impression time of each surface in `snapshot.surfaceShownAt`, so a late subscriber can still read it. Provider callbacks gain `onSurfaceShown` (React and Vue/Nuxt `callbacks.onSurfaceShown`); `@c15t/browser` dispatches `c15t:surfaceShown`; dev-tools log the event. A recorded choice now carries `timeToDecisionMs` (impression to action) on the `choice:recorded` event, on `onChoiceRecorded`, and on the saved consent as `metadata.timeToDecisionMs`. `kernel.commands.save()` accepts a `uiSource` override, and the React `uiSource` prop now reaches the save payload, so `ConsentWidget` saves are attributed to `widget` instead of the active banner. The never-fired `onBannerFetched` callback and `OnBannerFetchedPayload` type are removed.\n\n`kernel.markLive()` is public: an adapter that renders from a server-resolved prefetch and never calls `init()` calls it after hydration, so the server-rendered banner still counts as an impression. The core runtime, the React provider (and so Next.js and TanStack Start) and the Vue runtime (and so Nuxt) do this; before, an SSR page with a resolved prefetch never emitted `surface:shown`.\n\n`consentAction` on a saved choice now stays `all` or `necessary` when the host displays only a subset of the policy scope (`consentCategories`). It names the action the visitor took; `confirmed` names the categories it covered. Before, a narrowed accept-all was recorded as `custom`.\n\nA choice saved while a `notice` prompt is owed now records the notice dismissal with it. Before, a visitor who opened the preference center from an opt-out notice and rejected was shown the notice again.\n"
    filename: 2026-09-29-surface-shown-event.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/dev-tools\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n---\n\n### Match the DevTools panel to its host theme\n\nEmbedded DevTools panels, in Nuxt DevTools and in the TanStack Devtools plugin, now use their own light and dark palette instead of the app's consent theme. The TanStack plugin follows the TanStack Devtools theme. Before this change, a dark TanStack Devtools showed a white c15t panel.\n\nThe floating panel no longer mixes the page's consent theme with operating-system colors. Danger and success colors come from the panel's own surface and text, so they stay readable in light and dark themes.\n\nWhen an embedded panel is at least 48rem wide, it switches to a layout built for a devtools pane instead of stretching the floating card. Consent categories and vendors become tiles. Location, Actions, and Policy details sit in two columns. Scripts show name, source, and status on one row. Events show as a log, with each event's data behind a \"Data\" toggle. Embedded panels use 14px text on devices without a touchscreen. Narrow panes and the floating panel keep the single-column card, and narrow embedded panes wrap their tabs instead of clipping them.\n\nThe panel also has a clearer layout. Each form has one filled primary button. Effective consent, vendor access, and script state show as colored status pills. Clearing stored records now has its own section. On devices without a touchscreen, the floating panel uses the same compact controls as embedded panels.\n\n`c15tDevtools()` now returns a render function, which TanStack Devtools calls with its theme. `C15tTanStackDevtoolsPanel` accepts a `theme` prop of `'light'` or `'dark'`.\n"
    filename: 2026-09-30-devtools-panel-refresh.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/dev-tools\":\n    type: minor\n  \"@c15t/react\":\n    type: patch\n  c15t:\n    type: minor\n---\n\n### Inspect consent from a c15t tab in Nuxt DevTools\n\nIn development, the Nuxt module adds a c15t tab to Nuxt DevTools. The tab shows the DevTools panels for the app's consent kernel, including events and consent actions, and follows the DevTools light or dark theme. Production builds don't register the tab. Set `devtools: false` in the module options to turn it off.\n\n`c15t/vue/devtools` and `@c15t/vue/devtools` now export `ConsentDevToolsPanel`, which fills its parent element instead of floating over the page. `createDevTools` accepts `embedded: true` for the same layout, and can render into a same-origin iframe while it inspects the page that owns the kernel.\n\nEmbedded panels, including the TanStack Devtools plugin from `c15t/react/devtools`, no longer show their own c15t header, because the host already names the panel.\n"
    filename: 2026-09-26-nuxt-devtools-tab.md
    v: 0.0.0
  - content: "---\npackages:\n  c15t:\n    type: minor\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/ui\":\n    type: minor\n  \"@c15t/translations\":\n    type: minor\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/backend\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/tanstack-start\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/react-native\":\n    type: minor\n---\n\n### Rename the remaining `frame` names to `consentGate`\n\n**Breaking.** `ConsentGate` was called `Frame`, and several names still said so. They now say `consentGate`:\n\n- The translations section `frame` is now `consentGate` (`consentGate.title`, `consentGate.actionButton`, `consentGate.policyBlocked`, `consentGate.loading` and `consentGate.error`) in every bundled language, in `CompleteTranslations` and `Translations`, in the `/init` response schema, in `@c15t/backend` responses and in the React Native translation types. `FrameTranslations` is now `ConsentGateTranslations`, and the old name stays as a deprecated alias.\n- The stylesheet `@c15t/ui/styles/components/frame` is now `@c15t/ui/styles/components/consent-gate`, and its custom properties are `--consent-gate-*` instead of `--frame-*`.\n- The placeholder's test ids are `consent-gate-placeholder` and `consent-gate-button` instead of `frame-placeholder` and `frame-open-dialog`. Its title now has `consent-gate-title`.\n\nCopy under the old key still works. When custom translations, `i18n.messages`, stored copy or an older backend's `/init` response has `frame`, c15t reads it as `consentGate`, with `consentGate` winning key by key when both are set, and logs a warning once outside production. `@c15t/translations` exports the conversion as `migrateLegacyTranslationKeys`. The `frame` stylesheet subpaths stay as deprecated aliases of `consent-gate` for this alpha.\n\n`theme.slots` has a `consentGate` family for the placeholder: `consentGate` for the card, `consentGateTitle` and `consentGateButton`. React, Next.js, TanStack Start, Vue and Svelte apply them. React and Vue also take the same parts as `components['consent-gate'].root`, `.title` and `.button`, and `components` wins where both set an attribute. `consentGateButton` applies on top of `buttonPrimary`.\n"
    filename: 2026-09-30-consent-gate-rename.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/backend\":\n    type: minor\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/core\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### One tenant setting, refused when it is unsafe, and recovery for visitors whose subject ID another tenant holds\n\nA self-hosted backend now names its tenant in one place: the instance's `tenantId`. `manifest.tenantId` is removed from the backend configuration. It never scoped a database query, but it did scope policy snapshot tokens when the instance had no `tenantId`, so a config that set only that one issued tokens for a tenant while writing every consent with a null tenant. Built manifests no longer carry it. `ConsentManifest.tenantId` stays on the wire type for other manifest producers.\n\n`c15tInstance` and `createApp` check the tenant when the instance is built. They throw when `tenantId` is empty, padded with whitespace or not a string (a `null` from a JavaScript config used to scope every query to `tenantId = NULL`, which matches nothing), and when the config still sets `manifest.tenantId`, rather than ignoring it. The new `requireTenantId: true` option makes a missing `tenantId` throw too. Set it on every instance that shares a database with other tenants. Without it, an instance whose tenant lookup returned `undefined` starts in the single-tenant scope and writes consents with a null tenant, which the tenant that owns them never reads.\n\nSubject IDs are chosen by the browser and are unique across the whole database. A save naming a subject ID that another tenant holds was answered `400 CONFLICT`, on every save, with no way for the visitor to recover. It is now `409 SUBJECT_CONFLICT`. `@c15t/core` responds by giving the visitor a new subject ID, moving any queued saves to it, and sending the choice once more. Every open tab moves to the same new ID. A consent recorded again with different receipts, purposes or vendor grants is now `409 CONFLICT` instead of `400`. The hosted and manifest transports treat both as permanent refusals, so the kernel no longer replays them from its queue.\n\n#### Migration\n\n- Remove `tenantId` from the backend's `manifest` block and set it on the instance. If the instance already sets the same value, delete the manifest one. If it set only `manifest.tenantId`, the instance has been writing rows with a null tenant: setting `tenantId` scopes it to that tenant, and those rows stop appearing in its reads.\n- Code that matched `400` with `cause.code: 'CONFLICT'` from `POST /subjects` should expect `409`, and `SUBJECT_CONFLICT` for a subject ID held by another tenant. `PUT /legal-documents` conflicts are still `400 CONFLICT`.\n- A manifest built from a config that set `tenantId` gets a new `revision`, so cached manifests refresh once.\n"
    filename: 2026-09-30-tenant-isolation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/backend\":\n    type: minor\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/node-sdk\":\n    type: minor\n  c15t:\n    type: minor\n---\n\n### Index experiment attribution and summarise choices per arm\n\nSummarise banner experiments from the backend. Migration `6-experiment-attribution` adds `experimentId`, `experimentArm` and `timeToDecisionMs` columns to `consent`, indexed on `(tenantId, experimentId, experimentArm)`, and `POST /subjects` fills them from `metadata.experiment` and `metadata.timeToDecisionMs` while leaving `metadata` untouched. Values over 128 characters or malformed are dropped rather than failing the save. `GET /experiments/:id/summary` (API key) returns `arms: [{ arm, choices, byAction, bySurface, medianTimeToDecisionMs }]`, choices per arm split by stored `consentAction` (`byAction` always carries `accept_all`, `reject_all`, `opt_out`, `custom` and `unknown`) and `uiSource`, with the median time to decision, filtered by `from`, `to` and `domain`; the response is validated against the new `experimentSummaryOutputSchema` in `@c15t/schema`, and `@c15t/node-sdk` exposes it as `client.experiments.summary(id, { from, to, domain })`. The summary counts choices; the visitors each arm was owed to arrive on the session reports `/init` produces, so an opt-in rate divides the two.\n"
    filename: 2026-09-29-experiment-backend-summary.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/iab\":\n    type: major\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/schema\":\n    type: minor\n  \"@c15t/translations\":\n    type: minor\n  \"@c15t/ui\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/backend\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  c15t:\n    type: minor\n---\n\n### Support IAB TCF 2.4\n\nc15t now follows TCF 2.4 and TCF Policies v5.0.b. Existing TC strings stay valid.\n\n- The IAB preference centre shows Features in their own section with the IAB standard text and no controls. Special Purposes stay locked.\n- `__tcfapi` TC data includes `vendor.disclosedVendors`.\n- `isServiceSpecific` is deprecated. TC strings always set IsServiceSpecific=1.\n- Vendors that declare only Special Purposes no longer get a legitimate interest bit.\n- GVL schemas keep unknown fields, so `standardTexts` survives the backend cache.\n\n#### Migration\n\nHeadless IAB UIs: `resolveIABDialogDisplayModel` now returns Features in `featureRows` instead of `essentialRows`. Render them without a control, under `featuresStandardText` or your `features.description` translation when it is `null`.\n"
    filename: 2026-09-28-iab-tcf-2-4.md
    v: 0.0.0
  - content: "---\npackages:\n  c15t:\n    type: patch\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/nextjs\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/integrations\":\n    type: patch\n  \"@c15t/scripts\":\n    type: patch\n  \"@c15t/backend\":\n    type: patch\n  \"@c15t/cli\":\n    type: patch\n  \"@c15t/iab\":\n    type: patch\n---\n\n### Ship a c15t skill and the v3 guides in every package\n\nEach package now ships a `SKILL.md` next to `AGENTS.md`, telling coding agents\nhow to pick a setup, which rules to follow and how to verify consent, with\nlinks into the bundled Markdown. `@c15t/core`, `@c15t/react`, `@c15t/nextjs`,\n`@c15t/scripts`, `@c15t/browser`, `@c15t/integrations` and `@c15t/cli` publish\nit for the first time.\n\nThe bundled docs follow the rewritten v3 guides: concept pages, a setup\nchooser, a full page set for every framework, and a new HTML guide for the\nscript tag in `@c15t/browser`. `@c15t/iab` points its homepage and README at\nthe new IAB page.\n"
    filename: 2026-09-29-package-docs-and-skills.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/backend\":\n    type: minor\n---\n\n### Run the backend on Effect 4.0.0\n\n`@c15t/backend` now depends on the stable `effect@4.0.0` instead of `4.0.0-beta.102`. Its database driver peers moved to match, so install `@effect/sql-pg`, `@effect/sql-mysql2` or `@effect/sql-sqlite-node` at `4.0.0`. A beta driver no longer satisfies the peer range. If you pass your own `SqlClient` layer, import from `effect/sql` instead of `effect/unstable/sql`.\n\n`@effect/sql-pg` 4.0.0 replaces the `pg` package with its own PostgreSQL client and caches named prepared statements by default. Direct connections need no change. Behind a pooler in transaction mode, such as PgBouncer or a provider's pooled URL, queries can fail because the next connection never prepared the statement. Pass `PgClient.layer({ url, prepare: false })` as `database`; the [database setup guide](https://c15t.com/docs/self-host/guides/database-setup) shows the full config.\n"
    filename: 2026-10-02-backend-effect-4.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Add a Klaviyo integration\n\n`klaviyo()` from `@c15t/integrations/klaviyo` loads Klaviyo.js, which serves both signup forms and onsite tracking, only once marketing and measurement are both allowed. Pass `category` to use a different consent condition. `mode: 'forms-only'` loads on marketing alone and sets Klaviyo's `__kla_off` cookie before the bundle runs, so forms render while Klaviyo's web tracking stays off. The helper installs Klaviyo's queued `klaviyo` object and sends no `identify` or `track` calls of its own. Unlike Klaviyo's snippet, awaiting, serializing or stringifying that object before Klaviyo.js loads queues nothing, so it cannot stall the calls queued after it.\n\nRegistry entries can now declare a compound consent condition in `consentCategory`, such as `{ and: ['marketing', 'measurement'] }`, and there is a new `email-and-sms` integration category. Code that reads `consentCategory` as a string must handle the object form. The CLI offers Klaviyo in its integration picker.\n"
    filename: 2026-10-02-klaviyo.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: patch\n---\n\n### Fix consent handling, IDs and loader URLs in vendor helpers\n\nAmplitude now queues `setOptOut(false)` when it loads with measurement consent, so an opt-out Amplitude saved in its cookie after an earlier revocation no longer keeps tracking off. The Amplitude script now stays on the page after revocation (`persistAfterConsentRevoked: true`) and a later grant calls `setOptOut(false)` on the running SDK instead of loading the bundle a second time.\n\nHeap keeps the methods of a running heap.js when measurement consent is granted again without a page reload, instead of replacing them with queue stubs.\n\nMatomo with `defaultConsent: 'given'` queues `setConsentGiven` and the initial page view only when the visitor has measurement consent as the script loads, and queues `requireConsent` otherwise. Vendor helpers now run their consent-granted and consent-denied steps only when that vendor's consent changes, so a change to an unrelated category no longer queues another Matomo page view.\n\nUmami receives an array of `domains` as the comma-separated `data-domains` list its tracker reads, instead of a JSON array.\n\n`xPixelEvent`, `metaPixelEvent`, `metaPixelCustomEvent`, `metaPixelSingleEvent` and `metaPixelSingleCustomEvent` now do nothing when the pixel global is missing, like the other event helpers. `xPixelEvent` no longer throws before marketing consent.\n\nThe TikTok Pixel records the pixel in `ttq._i`, `ttq._t` and `ttq._o` the way `ttq.load()` does in TikTok's base code, and grants TikTok consent once instead of twice.\n\nHelpers with a required ID now throw `<helper>: missing or invalid <option>` when the ID is empty or only whitespace: `metaPixel`, `tiktokPixel`, `snapchatPixel`, `pinterestTag`, `redditPixel`, `xPixel`, `linkedinInsights`, `microsoftUet`, `openaiPixel`, `googleTagManager`, `gtag`, `posthog`, `databuddy`, `fathomAnalytics`, `crisp` and `intercom`. These IDs are also trimmed. An empty or whitespace-only `scriptUrl` or `scriptSrc` now counts as unset and uses the vendor's default loader.\n\nCrisp keeps a `window.$crisp` queue the page filled before the helper ran.\n\n`cloudflareZaraz` now sets `vendor: 'cloudflare-zaraz'`, so visitors can turn it off like other vendors. While it is off, every Zaraz purpose mapped to an optional category is denied.\n"
    filename: 2026-09-29-scripts-vendor-fixes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n  \"@c15t/scripts\":\n    type: minor\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Rename the vendor integrations package\n\nReplace `@c15t/scripts` with `@c15t/integrations` in v3 dependencies and imports.\nVendor subpaths, helper names, and the `scripts` configuration option stay the\nsame. `@c15t/scripts` remains available as a deprecated compatibility package\nthroughout v3, re-exporting the same implementation and types. Compatibility\nends in v4; previously published versions remain available on npm.\n\nThe CLI installs and imports `@c15t/integrations` in generated applications.\nRun `c15t codemods scripts-to-integrations --dry-run --json` to preview import\nchanges in JavaScript and TypeScript files, then repeat without `--dry-run` to\napply them. Update package dependencies and Vue or Svelte component imports\nseparately.\n"
    filename: 2026-09-29-rename-integrations.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Resolve Nuxt visitors in the browser on prerendered and cached routes\n\nNuxt pages that are prerendered, or cached by a `cache`, `swr`, `isr` or `prerender` route rule, no longer carry the consent records, location and request headers of the render that produced them. That HTML is served to every visitor, so it now renders without the banner, and the browser requests the visitor's policy and reads their stored choice after hydration. Before, the browser reused the build-time or first visitor's result and skipped its own policy request, and a visitor who rejected saw the banner again after a reload.\n\nIn the browser, a newer denial kept in localStorage now also applies on top of the records the server read from the request cookie, instead of being overwritten by them.\n"
    filename: 2026-09-29-nuxt-shared-html.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Apply `theme.slots` in React and Vue\n\n`theme.slots` now styles the stock parts in React and Vue, as it already did in Svelte, Astro and the script tag. Each slot maps onto the matching `components` part (`consentDialogCard` onto `dialog.card`, `toggle` onto `switch.root`), and `components` wins where both set the same attribute. A slot with `noStyle: true` drops that part's stock classes and keeps the slot's and the part's own classes, as in the other adapters; a slot that sets only `noStyle` applies too. React used to accept `theme.slots` in its types and ignore it.\n\nThe `frame` and `consentDialogFooter` slot keys are removed: no adapter read them. Style the stock dialog's footer with `consentWidgetFooter`, and the `ConsentGate` placeholder with the new `consentGate` slots.\n\nIn Vue, the assigned experiment arm's `theme.slots` merge over the host theme's, as they already did in React, so an arm that changes only a slot renders its classes and styles.\n\nA numeric length in a slot style, such as `{ padding: 8 }`, now renders as `8px` in Vue too. Vue writes style objects as given, so the number used to be dropped.\n"
    filename: 2026-09-30-theme-slots-react-vue.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/react-native\":\n    type: patch\n---\n\n### Show only necessary when a site declares no categories\n\nA site that declares no categories, through `consentCategories`, scripts, network rules, vendors or discovered frames, now offers only Strictly necessary under a permissive policy, as in v2. The banner still appears when the policy asks for a choice. Accept all, Reject all and Save each record an acknowledgement that keeps the banner dismissed after reload, and hosted and manifest modes send a consent receipt for necessary alone. The acknowledgement expires with the policy's choice validity or a policy change, and a category declared later asks again. Strict policies and IAB TCF policies still offer their whole scope.\n\nThe Astro server now judges a visitor against the categories the page's `consentCategories`, `scripts` and network rules declare, so it renders the same banner decision as the browser. Browser `hasConsented()` and the `after-consent` trigger treat the acknowledgement as a decision.\n\nIn React Native, the Swift and Kotlin cores apply the same rule when the app sets no `consentCategories`: a permissive policy offers only Necessary, any save records the acknowledgement and sends the necessary-only receipt, and strict policies still offer their whole scope. A declared list now also narrows what Accept all and Reject all confirm, as on the web.\n"
    filename: 2026-09-28-necessary-only-scope.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Load new copy when the Vue consent language changes\n\nAssigning a new language to `useConsentLanguage()` now runs init again, so the banner and dialog switch to that language without a separate `commands.init()` call. Assigning the current language does nothing. The Nuxt `ConsentRoot` now takes the same `language` prop as the Vue `ConsentRoot`.\n\nA `country`, `language` or `region` prop on the Vue or Nuxt `ConsentRoot` no longer runs an extra init on every page load. A prop equal to what the server already resolved, such as the prefetched language, runs none; a different value is sent with the startup init, or with one init when the server prefetched. Init no longer runs during server rendering. Changing a prop after the page has loaded still runs init once.\n"
    filename: 2026-09-30-vue-consent-language.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/schema\":\n    type: patch\n  c15t:\n    type: patch\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Start the banner's entry from the stylesheet, and keep the collator off the init path\n\nCanonical sets and fingerprint keys were sorted with\n`String.prototype.localeCompare`, whose first call initialises the ICU\ncollator on the main thread before the banner can show. They now use a\ncomparator that applies the same root-collation order to printable ASCII\ndirectly and only falls back to the collator for other strings, so every\nfingerprint stays byte-identical.\n\nEvery framework also started the banner's entry transition its own way: the\nscript tag and Svelte inserted the hidden state, forced a layout and flipped\nthe class; React rendered hidden and flipped after a timer; Vue handed the\nflip to `Transition`; Astro's prerendered banner did not animate at all.\n`@c15t/ui` now carries the entry as `@starting-style` states, the\n`bannerEntering`, `overlayEntering`, `dialogEntering` and `contentEntering`\nclasses, and each framework renders the banner in its visible state with the\nentering class. The transition runs from the first frame with no hidden\nrender or layout read, and it runs the same way whether the banner arrives\nfrom the server or the client. Astro's prerendered banner now fades in at\nfirst paint like the others. Browsers without `@starting-style` show the\nbanner in place; the script tag keeps its class flip for them.\n"
    filename: script-tag-init-path.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Fetch a `manifestURL` in the browser from the plain Vue plugin\n\nWith the plain Vue plugin, setting `manifestURL` without `manifest` now selects client manifest mode: the browser fetches that manifest and resolves the policy itself. Before, it selected server mode and called `/api/c15t/init`, a route only the Nuxt module registers. The Nuxt module is unchanged: its `manifest` option defaults to `false`, so a `manifestURL` there needs `manifest: 'server'` or `manifest: 'client'` as well.\n"
    filename: 2026-09-30-vue-plain-manifest-url.md
    v: 0.0.0
  - content: "---\npackages:\n  c15t:\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/nextjs\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Load the Tailwind 3 PostCSS plugin from the package you installed\n\nEvery package that publishes a c15t stylesheet now exports the Tailwind 3 PostCSS plugin as `<package>/postcss-tailwind3`, so you no longer install `@c15t/ui` just to list it:\n\n- `c15t/postcss-tailwind3` for apps that install `c15t` (React, Next.js, TanStack Start, Vue, Nuxt and Astro)\n- `@c15t/svelte/postcss-tailwind3` for Svelte and SvelteKit\n- `@c15t/browser/postcss-tailwind3` for script tag pages that style the light DOM\n- `@c15t/react/postcss-tailwind3`, `@c15t/nextjs/postcss-tailwind3`, `@c15t/tanstack-start/postcss-tailwind3`, `@c15t/vue/postcss-tailwind3` and `@c15t/astro/postcss-tailwind3` for apps that install an adapter directly\n\n```js title=\"postcss.config.mjs\"\nexport default {\n\tplugins: {\n\t\t'c15t/postcss-tailwind3': {},\n\t\ttailwindcss: {},\n\t\tautoprefixer: {},\n\t},\n};\n```\n\nEach one re-exports `@c15t/ui/postcss-tailwind3`, so configs that already list that name keep working. The plugin must still come before `tailwindcss`.\n\n`c15t setup` now adds the plugin from the package it installs, `c15t/postcss-tailwind3`, or `@c15t/react/postcss-tailwind3` and `@c15t/nextjs/postcss-tailwind3` in apps that installed those directly, and no longer installs `@c15t/ui` for Tailwind 3. It leaves a config alone when any c15t `postcss-tailwind3` entry, including `@c15t/ui/postcss-tailwind3`, already runs before `tailwindcss`.\n"
    filename: 2026-10-01-postcss-tailwind3-per-package.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Show the Vue dialog trigger after the prompt under `after-consent`\n\n`triggerShowWhen: 'after-consent'`, the default, now hides the floating `ConsentDialogTrigger` until the policy owes no prompt: a choice is saved or a notice is dismissed. Before, only `'never'` was checked, so the trigger showed next to an unanswered banner. Set `triggerShowWhen: 'always'` to keep it visible while the banner is open.\n"
    filename: 2026-09-30-vue-trigger-after-consent.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Ship the stock dark palette in Vue and Nuxt\n\nThe token CSS that Vue and Nuxt write into `<style id=\"c15t-css-vars\">` now carries the stock dark colors under the `.dark` and `.c15t-dark` selectors, as the React and Svelte stylesheet does. With `colorScheme` and `theme` unset, a `dark` class on `<html>` used to switch the class but leave the light colors in place.\n"
    filename: 2026-09-30-vue-stock-dark-palette.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Type `nonce`, `iframeBlocker`, `storageConfig`, `domain` and `app.config.ts` for Nuxt\n\nThe Nuxt module options now accept `nonce`, `iframeBlocker`, `storageConfig` and `domain`, which the runtime already read. The `c15t` key of `app.config.ts` is now typed, including when the module is registered as `c15t/vue`, and accepts `networkBlocker.onRequestBlocked`. Module options pass through JSON and cannot hold that callback, so set it in `app.config.ts`.\n"
    filename: 2026-09-29-nuxt-config-types.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Open the preference dialog with focus on its first control\n\nThe consent dialog and the IAB dialog used to focus their own container on\nopen and draw a focus ring around the whole card for keyboard users. They now\nfocus the first tabbable control inside the panel, the way dialog libraries\nsuch as Base UI do, so the ring lands on a control. Screen readers still\nannounce the title and description as focus enters, through the panel's\n`aria-labelledby` and `aria-describedby`. Blocking banners keep focusing\ntheir container so no action button is favored. `setupFocusTrap` in\n`@c15t/ui` takes an `initialFocus` option, and the React hook, Svelte action\nand Vue composable pass it through.\n"
    filename: dialog-initial-focus.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Fix IAB feature styling, accessibility, and Astro script escaping\n\nApply theme spacing and typography to the IAB feature section. Hide decorative\nfeature disclosure arrows from screen readers in Vue. Escape Astro client module\npaths and adapter names when generating page scripts.\n"
    filename: 2026-09-30-v3-ci-fixes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Add `colorScheme` and dark theme tokens to Vue and Nuxt\n\nThe Vue plugin and the Nuxt module accept `colorScheme`, with the same values as the React and Svelte providers. `'light'` and `'dark'` force a scheme, `'system'` follows `prefers-color-scheme` as the visitor changes it, and leaving it unset mirrors a `dark` class on `<html>` into `c15t-dark`. `null` leaves `c15t-dark` to the site. Before, Vue never set `c15t-dark`, so the dark component styles only applied when the site set that class itself.\n\nBoth also accept `theme`, the same token object `@c15t/react` takes, including `theme.dark`. Its tokens go into the `<style id=\"c15t-css-vars\">` element with `tokens`, and win where both set a variable. Vue still reads slot overrides from `components`.\n\n```ts\n// nuxt.config.ts\nexport default defineNuxtConfig({\n\tc15t: {\n\t\tcolorScheme: 'system',\n\t\ttheme: { dark: { primary: '#7fd1a8' } },\n\t},\n\tmodules: ['@c15t/vue'],\n});\n```\n\nNuxt renders an inline script in `<head>` that sets `c15t-dark` for `'dark'` and `'system'`, with the configured `nonce`, so a dark visitor's first paint is already dark. `generateTokensCSS()` takes the scheme and theme as a second argument for plain Vue server rendering. A plugin given a borrowed `runtime` leaves the class to the host, as it does the tokens.\n"
    filename: 2026-09-30-vue-color-scheme.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Translate the Vue preferences link and match the consent gate placeholder to React\n\n`ConsentPreferencesLink` now defaults to the `consentManagerDialog.title` translation instead of the fixed text \"Privacy settings\".\n\nThe `ConsentGate` placeholder was the fixed text \"Content requires permission.\". It now renders the same placeholder as the React and Svelte gates: the `consentGate.title` text with the category name and a button labelled with `consentGate.actionButton` that opens the preference center. The gate also adds its category to the categories the preference center lists. Under a strict policy that leaves the category out, the placeholder shows `consentGate.policyBlocked` and no button.\n\nBoth components use the visitor's language once init has delivered copy, and English until then. Slot content, including the gate's `placeholder` slot, still replaces the defaults.\n"
    filename: 2026-09-30-vue-translated-link-gate.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Keep Vue components styled next to Tailwind 4\n\nVue components import their stylesheets one component at a time, and Vite links those stylesheets ahead of the app's CSS when they share a chunk. The first of them declared `@layer components` before Tailwind 4 declared `base`, so Tailwind's preflight removed the banner's padding, borders and button backgrounds. Each `@c15t/ui/styles/components/*.css` file now opens with Tailwind 4's layer order, `@layer properties, theme, base, components, utilities;`, as the aggregate stylesheets already did.\n\nThe dialog trigger stylesheet now keeps its rules in `@layer components` as well, so a Tailwind utility passed to the Vue trigger overrides it the same way it does in React.\n"
    filename: 2026-09-30-vue-tailwind-4-layer-order.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Accept `disableAnimation` on the Vue banners and dialogs\n\n`consent-banner.vue`, `consent-manager.vue` and the IAB banner and dialog take a `disableAnimation` prop that overrides the config's `disableAnimation` for that surface, as the React components do. Left unset, they follow the config.\n"
    filename: 2026-09-30-vue-disable-animation-prop.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Keep `colorScheme: null` in Nuxt\n\n`colorScheme: null` under the `c15t` key of `nuxt.config.ts` or in `app.config.ts` now leaves the `c15t-dark` class on `<html>` to the site, as it does in Vue, React and Svelte. Nuxt merges options in a way that drops `null`, so it used to behave like an unset `colorScheme` and copy a `dark` class. A `null` passed as inline module options (`modules: [['@c15t/vue', { colorScheme: null }]]`) is still dropped by Nuxt before the module sees it; set it under the `c15t` key instead.\n"
    filename: 2026-09-30-nuxt-color-scheme-null.md
    v: 0.0.0
  - content: "---\npackages:\n  c15t:\n    type: minor\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n---\n\n### An undeclared vendor reads as not allowed\n\nBreaking change: reading vendor consent for an id that no `vendors` entry, script slug or backend vendor list declares now returns `false`. Before, React's `useVendorAllowed`, Astro's `client.isVendorAllowed` and `@c15t/browser`'s `isVendorAllowed` returned `true` for such an id without checking any category, so a typo or a missing declaration read as allowed before the visitor consented. In development, c15t logs one warning per undeclared id that names the missing declaration. Declare every vendor you read, for example `vendors: [{ id: 'youtube', category: 'measurement', ... }]`.\n\nThe rule lives in one helper, `isVendorAllowed(snapshot, vendorId, now?)`, exported from `c15t` and `@c15t/core`. A declared vendor keeps its behaviour: it is allowed when its category condition passes and, outside an IAB policy, the visitor has not switched it off.\n\nVue gains `useVendorAllowed(vendorId)`, which returns a computed boolean and is auto-imported in Nuxt. The Svelte consent manager from `getConsentManager()` gains `isVendorAllowed(vendorId)`.\n\nScripts, iframes and network rules that carry an undeclared `vendor` slug are gated as before: they follow their category.\n"
    filename: 2026-09-30-undeclared-vendor-not-allowed.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Pass `shadow` from `ConsentDevTools` to the DevTools panel\n\n`ConsentDevTools` in `@c15t/svelte`, `@c15t/react` and `@c15t/vue` accepted\n`shadow` in its props type but never passed it to `createDevTools`, so the\npanel always mounted inside a shadow root. The Vue component did not\ndeclare the prop at all. `shadow={false}` now mounts the panel in the light\nDOM, with its stylesheet in `<head>`, as the `@c15t/dev-tools` option\ndescribes. Leaving `shadow` out keeps the shadow root.\n"
    filename: 2026-09-30-svelte-devtools-shadow.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Auto-import the experiment composables in Nuxt\n\nNuxt auto-imports `useExperiment()` and `useResolvedPresentation()`, so a page can read the assigned banner-experiment arm without importing from `c15t/vue/vue-plugin`.\n"
    filename: 2026-09-29-nuxt-experiment-composables.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Apply Vue theme tokens before the first paint\n\nThe Nuxt module now adds the `tokens` CSS variables to the page head from its plugin, so server-rendered and prerendered HTML carries them on every page, with the configured `nonce`. The plain Vue plugin adds them to `document.head` when it is installed, before the first render, and removes them when the last app using them unmounts. A second app on the same page reuses the element, and a `<style id=\"c15t-css-vars\">` rendered by the server is left in place. Before, the Vue `ConsentRoot` set them only after mount, so the first paint used the defaults, and surfaces composed without a `ConsentRoot` never got them.\n\nFor plain Vue apps rendered on the server, `generateTokensCSS()` from `@c15t/vue/vue-plugin` returns the same CSS to put in a `<style id=\"c15t-css-vars\">` element in the server HTML.\n"
    filename: 2026-09-30-vue-tokens-first-paint.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Stop the floating trigger's transitions when `disableAnimation` is set\n\nThe floating dialog trigger and the trigger toolbar now carry `data-disable-animation` when the provider's `disableAnimation` is on, and the stylesheet then drops their hover and snap-to-corner transitions. They already stop under `prefers-reduced-motion: reduce`.\n"
    filename: 2026-09-30-trigger-disable-animation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/cli\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/schema\":\n    type: patch\n  \"@c15t/scripts\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/translations\":\n    type: patch\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Update documentation links\n\nPoint documentation links in CLI prompts and errors, runtime warnings, TSDoc, package READMEs and package homepages at the current c15t.com docs pages. The old addresses led to pages that were moved or removed.\n"
    filename: 2026-09-29-docs-links.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Let the page decide the scheme with `colorScheme: null`\n\n`mountConsentUI()` and `init()` accept `ui.colorScheme: null`, and the script tag accepts `data-color-scheme=\"none\"`. The UI is then dark while `<html>` has a `dark` or `c15t-dark` class, and follows the class as the page changes it. The UI renders in a shadow root that the page's class cannot reach, so c15t copies it onto the UI host. Before, the only choices were `light`, `dark` and `system`, and the default stays `system`.\n"
    filename: 2026-09-30-browser-color-scheme-null.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Use the theme's motion tokens on the floating trigger\n\nThe floating dialog trigger now times its hover and snap transitions with `--c15t-duration-slow`, `--c15t-easing-out` and `--c15t-easing-in-out`. It read variables no theme sets, so `theme.motion` never reached it.\n"
    filename: 2026-09-30-ui-trigger-motion-tokens.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Pass a CSP nonce and the remaining runtime options through `@c15t/browser`\n\n`init()` and `createConsentClient()` accept a `nonce` option. The stock UI's `<style>` element and every `<script>` the `scripts` option loads carry it, so the banner renders under a Content Security Policy that allows styles or scripts by nonce instead of `'unsafe-inline'`. Before, the injected `<style>` element had no nonce and a nonce-based `style-src` blocked the whole stylesheet.\n\nThe script tag reads the nonce from `data-nonce`, or from the tag's own `nonce` attribute when `data-nonce` is absent, so `<script nonce=\"...\" src=\".../c15t.js\">` needs no extra configuration.\n\nWith a nonce configured, inert `<script type=\"text/plain\" data-c15t-category>` tags run only when they carry that same nonce. Other tags are skipped with a console warning and marked `data-c15t-activated=\"untrusted\"`. c15t runs an inert tag by creating a new `<script>` element, and a policy with `'strict-dynamic'` runs scripts created by trusted code without checking for a nonce. Without this check, a tag injected through an HTML-injection hole would run as soon as its category was granted, whether it was inline or had a `src`. The configured nonce is never copied onto an inert tag. Add `nonce=\"...\"` to your own gated tags, including ones your code inserts later. Pages without a configured nonce activate inert tags as before. `activateGatedScripts()` takes the same check as a `nonce` option. Passing a different nonce on a later call for the same root replaces the earlier one, so a first call made before the page knew its nonce no longer leaves that root open to tags without it.\n\nThe client also passes `vendors`, `persistence` and `scriptLoader` to the consent runtime. Before, all three were ignored.\n"
    filename: 2026-09-30-browser-csp-nonce.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Replay every queued script-tag call\n\nCalls pushed onto `window.c15t` before the script loads now all run. Before, queueing any method other than `config`, `on` or `onInit` threw during replay and dropped every call queued after it.\n\n`config`, `init`, `on` and `onInit` still run in place. `subscribe` attaches once the client exists. Actions such as `openDialog`, `showBanner`, `acceptAll`, `rejectAll`, `save`, `setLanguage` and `identify` run in queue order once the policy has resolved, so a queued `openDialog` is not replaced by the banner. Methods that only return a value, such as `getSnapshot` or `has`, and unknown names are skipped with a console warning. A queued call that throws is reported with `console.error` and the calls after it still run.\n\n`window.c15t.push([...])` also works after the script has loaded: it runs each call the same way as a call queued before load. Actions from separate `push()` calls also run in order: each batch waits for the actions from earlier calls to settle, so `c15t.push(['acceptAll']); c15t.push(['rejectAll']);` always ends with consent rejected. `c15t.dispose()` drops actions that have not run yet, so they never reach the disposed client or the one a later `init()` creates, and actions pushed after it run as usual. Actions that a listener pushes while a batch runs `init`, for example from a `ready` listener, run after that batch's own actions. A snippet written as `window.c15t = window.c15t || []; c15t.push([...])` no longer throws when it runs after the tag.\n"
    filename: 2026-09-29-browser-queue-replay.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Open the preference dialog without animation when `disableAnimation` is set\n\nThe Svelte and script-tag preference dialogs no longer fade and scale in when `disableAnimation` is on. Their overlay and panel now carry `data-disable-animation`, as the Vue dialog does.\n"
    filename: 2026-09-30-dialog-disable-animation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Style stock UI parts with `theme.slots`, `::part()` and `stylesheetURLs`\n\nThe banner, preference centre, floating trigger and IAB surfaces now apply `ui.theme.slots`, the per-part class and style map `@c15t/ui` and `@c15t/svelte` already read. A slot such as `consentBannerCard`, `consentDialogCard`, `consentDialogTrigger`, `buttonPrimary` or `toggle` takes a class string or `{ className, style }`, and `noStyle: true` on a slot replaces that part's stock classes. Slot classes stay when `ui.noStyle` is set.\n\nEach of those parts also carries its slot key in a `part` attribute, so page CSS can style it inside the shadow root with `[data-c15t-ui]::part(consentBannerCard)`.\n\nA class from the page's stylesheet only reaches a part with `shadow: false`. In the default shadow root, the new `ui.stylesheetURLs` option links stylesheets inside it, after the bundled one and with the client's nonce, so Tailwind, CSS Modules or vanilla-extract classes apply there too. The script tag accepts both through `c15t.push(['config', { ui: { … } }])`.\n\nA slot's numeric `style` values get `px` where the property takes a unit, as React writes them: `{ padding: 8 }` renders `padding: 8px`, while `opacity`, `zIndex`, `flexGrow`, `lineHeight` and the other unitless properties keep the bare number. An experiment arm's `theme.slots` apply to the parts of visitors assigned that arm, merged over the host theme's slots. When the arm changes after the UI mounts, the floating trigger and its icon drop the previous arm's slot classes and styles and take the new arm's.\n"
    filename: 2026-09-30-browser-part-classes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Close the preference dialog on Escape wherever focus is\n\nThe stock preference dialog now closes on Escape even when focus is outside it, as the React and Vue dialogs do. Before, a non-blocking dialog, which does not trap focus, closed only when focus was inside it.\n"
    filename: 2026-09-30-browser-dialog-escape.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Apply `generateThemeCSS` output wherever it lands in the page\n\nA theme rendered with `generateThemeCSS` used the same selectors as the\ndefault tokens in `styles.css`, so whichever came later in the document won.\nSvelteKit writes `<svelte:head>` content before its stylesheet links, so a\ntheme rendered there, as the SvelteKit guide shows, was replaced by the\ndefaults. The generated selectors now carry one more specificity point\n(`:root:root`, `.c15t-theme-root.c15t-theme-root`), so in the document the\ntheme overrides the defaults before or after the stylesheet. Inside a shadow\nroot, `:host` keeps the defaults' specificity, so the theme still has to come\nafter the stylesheet there; the script tag's mount already writes it last.\nThis covers `ConsentTheme` in\nReact, Next.js and TanStack Start, Astro's server-rendered theme and the\nscript tag's `theme` option too.\n\nYour own CSS that sets `--c15t-*` variables on plain `:root` next to a\ngenerated theme now loses to the theme. Put those values in the theme, or\nraise the selector to `:root:root`.\n"
    filename: 2026-09-29-theme-css-outranks-defaults.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/core\":\n    type: patch\n---\n\n### Check iframes on demand with `processIframes()`\n\n`iframeBlocker: { disableAutomaticBlocking: true }` is now usable outside React. The consent runtime from `@c15t/core/runtime` has a `processIframes()` method, and `@c15t/browser` exposes it as `client.processIframes()` and `c15t.processIframes()`. Each call pauses gated frames (`data-category` or `data-vendor`) that consent does not allow and restores the ones it does. With automatic blocking on, the blocker still does this by itself. `c15t.push(['processIframes'])` runs once the policy has resolved.\n"
    filename: 2026-09-30-browser-process-iframes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Set `disableAnimation` per surface and from the script tag\n\nThe `banner` and `dialog` UI options accept `disableAnimation`, which overrides the UI-level `disableAnimation` for that surface. The script tag reads `data-disable-animation` to turn animations off for the whole UI.\n\n```html\n<script src=\"https://cdn.jsdelivr.net/npm/@c15t/browser@alpha/dist/c15t.js\" data-disable-animation></script>\n```\n"
    filename: 2026-09-30-browser-surface-disable-animation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Keep dispatching client events when a listener throws\n\nA listener registered with `on()` that throws no longer stops the listeners after it or the matching `c15t:*` document event. The error is logged with `console.error`. This also covers the `ready` and `ui` listeners that `on()` calls at once after the policy has resolved, so `on()` still returns its unsubscribe function.\n"
    filename: 2026-09-30-browser-isolate-listeners.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/cli\":\n    type: patch\n  \"@c15t/translations\":\n    type: patch\n---\n\n### Keep app `i18n.messages` overrides when the backend sends translations\n\nIn hosted and manifest mode, the translations from `/init`, from a server prefetch or from a manifest replaced the app's `i18n.messages` for the same language, so a key overridden in code showed the backend's copy instead. This affected React, Next.js and TanStack Start through the React provider, Svelte and SvelteKit (including `resolveConsent()` prefetches), Astro and `@c15t/browser`.\n\nThe backend copy is now the base for the visitor's language and the app's `i18n.messages` for that language are deep-merged over it. An app key replaces the backend's text when it differs from c15t's built-in copy for that language, or for its primary language. A key that repeats the built-in text does not hide the backend's copy, so an app that passes the stock bundles to enable languages, such as `{ ...baseTranslations.de }`, still shows edits made on the backend, while a customized key still wins. Keys the backend does not supply keep the app's copy, so a language the backend does not send still shows the app's copy in full. Overrides for other languages are not applied. A regional language such as `de-AT` uses the overrides under `de` when there is no `de-AT` entry.\n\nBuilt-in copy is known for English and, once `@c15t/translations/all` has loaded, for every bundled language. Without it, every app key counts as a customization. `@c15t/translations` adds `getStockTranslations()` for this, and `/all` registers its languages when it loads. The package now lists `dist/all.js` under `sideEffects`, so a bare `import '@c15t/translations/all'` survives tree shaking.\n\nAstro also deep-merges `i18n.messages` now. Before, a partial override such as `{ cookieBanner: { title } }` replaced the whole `cookieBanner` section and left its other keys empty. A regional `i18n.locale` or `Accept-Language` such as `de-AT` now renders over the `de` bundle instead of English.\n\n`@c15t/core` now exports `offline()`, a mode for `createConsentRuntime()` that resolves policy rules locally. A language set through the kernel, with `overrides.language` or `kernel.set.language()`, switches the copy when c15t's built-in copy or `i18n.messages` has that language, falling back to the primary language, so `de-AT` uses German copy. Built-in copy covers English, and every bundled language once `@c15t/translations/all` has loaded. A language with no copy gets the startup copy back, still labelled with the startup language. The language a server prefetch detected from `Accept-Language` does not switch the copy until the app has asked for a different language. `@c15t/browser` uses this transport, so `data-language`, the `overrides.language` option and `setLanguage()` now switch the copy in offline mode. The Svelte `offline()` mode is unchanged. The JavaScript, Vue and Solid boilerplate from `@c15t/cli generate` now uses core's `offline()`, and the generated offline kernel config passes `translationsFor` with `baseTranslations` from `@c15t/translations/all`, so generated projects switch to any bundled language too. The CLI installs `@c15t/translations` for that config.\n\n`createOfflineTransport()` accepts `translationsFor` and `detectedLanguage` options with the same behavior. Without `translationsFor` it still relabels its copy with the requested language, as before.\n\n`@c15t/core` also adds a `translationOverrides` kernel option, the `applyTranslationOverrides()` and `resolveLocalTranslations()` helpers, and an optional `translationsFor` on the transport factory context.\n"
    filename: 2026-09-30-i18n-overrides-over-backend.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Keep fixed elements still when a consent dialog locks scrolling\n\nA blocking banner or dialog no longer shifts the page sideways on systems that show classic scrollbars, such as Windows, Linux and macOS with \"Always show scrollbars\" enabled. The scroll lock used to pad `<body>` by the scrollbar width, which kept in-flow content in place but still widened the viewport, so fixed headers, right-aligned controls and side panels jumped by the scrollbar width. It now sets `scrollbar-gutter: stable` on `<html>` while the page is locked, so the viewport keeps its width. Pages without a visible scrollbar get no gutter, and a `stable` gutter the page already sets is left alone. Browsers without `scrollbar-gutter` support still get the `<body>` padding.\n\nThe lock now also works on pages that set `overflow` on `<html>`, where hiding `<body>` overflow alone did not stop the page scrolling, and it restores inline `overflow-x` or `overflow-y` values it replaced instead of clearing them.\n"
    filename: 2026-09-28-scroll-lock-gutter.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Keep checked switches inside their track in right-to-left languages\n\nIn Arabic, Hebrew and other right-to-left copy, a checked switch in the preference dialog now moves its thumb to the left end of the track. The rule only matched a `dir` attribute on the switch itself, which no adapter sets, so the thumb slid past the track's edge.\n"
    filename: 2026-09-30-ui-rtl-switch.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n---\n\n### Stop banner and dialog motion under reduced motion in every adapter\n\nThe `prefers-reduced-motion: reduce` rules now use the same selectors as the rules that animate each part, so they win wherever an adapter puts the class. They were one class lighter for the banner and dialog, so Vue, Nuxt and Astro banners still slid in for visitors who asked for less motion. The fix also covers the sidebar dialog, secondary and dark button hovers, tab triggers, the accordion row and the IAB tab indicator.\n"
    filename: 2026-09-30-ui-reduced-motion.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n---\n\n### Granular vendor consent in Astro and the script tag\n\nAstro and `@c15t/browser` now support per-vendor consent like the other adapters. A visitor can allow a category and still turn one vendor off.\n\nIn Astro, pass `vendors` to `c15t()`. Vendors from the backend manifest are merged in. The preference dialog lists each category's vendors with a switch per vendor for the React, Vue and Svelte islands. The switches edit the draft and are saved with Save. They are disabled while the category is off and cleared by Accept all and Reject all. `getConsentClient()` gains `getDeclaredVendors()`, `getVendorChoice()` and `isVendorAllowed(vendorId)`, and `save()` accepts a `vendors` map. The server now asks about the categories that code-declared vendors sit in, so its banner decision matches the browser's.\n\nIn `@c15t/browser`, declare vendors with the `vendors` option or `c15t.push(['config', { vendors }])`. The stock preference centre lists vendor switches with the same behaviour and the `@c15t/ui` vendor list styles and translations. The client and `window.c15t` gain `getDeclaredVendors()`, `getVendorChoice()` and `isVendorAllowed(vendorId)`. `save()` now forwards a `vendors` map instead of dropping it, so `c15t.push(['save', { measurement: true, vendors: { posthog: false } }])` works. A change to vendors alone now emits `consent` and runs gated tags that were waiting.\n\nBoth adapters gate inert `<script type=\"text/plain\" data-c15t-category=\"…\">` tags by vendor when the tag also carries `data-c15t-vendor=\"…\"`, and gate iframes that carry `data-vendor`. The nonce rule for gated tags is unchanged.\n"
    filename: 2026-09-30-vendor-consent-astro-browser.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/node-sdk\":\n    type: major\n  \"@c15t/schema\":\n    type: patch\n---\n\n### Replace the Node.js client with `createC15tClient`\n\n`@c15t/node-sdk` has a new client. Create it with `createC15tClient({ baseUrl, apiKey })`. Every method resolves to `{ ok: true, data }` or `{ ok: false, error }` and never rejects, and `error.code` is typed per method. Input is checked before anything is sent, response dates are `Date` objects, and calls retry network errors, timeouts and 408, 429, 500, 502, 503 and 504, honouring `Retry-After`. A client created without `apiKey` has no `subjects.list`, `experiments.summary` or `legalDocuments.publish`. New methods: `manifest()` and `legalDocuments.publish()`. `@c15t/node-sdk/testing` exports `createMockC15tClient`, `ok` and `err`.\n\n`patchSubjectOutputSchema` in `@c15t/schema` now matches what the backend sends: it drops `success` and adds `subject.identityProvider`.\n\n#### Breaking changes\n\n- `c15tClient()` and the `C15TClient` class are removed. Use `createC15tClient()`.\n- The client no longer reads `C15T_API_URL`, `C15T_API_TOKEN` or `C15T_DEBUG`. Pass `baseUrl` and `apiKey`.\n- `token` is now `apiKey`, `timeout` is `timeoutMs`, and `retryConfig` is `retry`. `prefix` and `debug` are removed; put the path in `baseUrl` and use `onEvent` for logging.\n- The flat methods (`getSubject`, `checkConsent`, `patchSubject` and the rest) and `client.meta` are removed. Use the namespaced methods and `status()` and `init()`.\n- `subjects.patch` is now `subjects.identify`, and returns `{ subject }` without `success`.\n- `consent.check({ externalId, type: 'a,b' })` is now `consents.check({ externalId, types: ['a', 'b'] })`. `subjects.get` takes `{ types }` the same way.\n- `ResponseContext` and its `unwrap`, `unwrapOr`, `expect` and `map` are replaced by result objects and the `unwrap(result)` helper. The `throw`, `onSuccess` and `onError` call options are removed.\n- `C15TError` and `isC15TError` are now `C15tError` and `isC15tError`.\n- `$fetch`, `fetcher`, `resolveUrl` and `createResponseContext` are no longer exported. Pass `fetch` to the client instead.\n- `createMockClient`, `createMockResponse` and `createMockErrorResponse` are replaced by `createMockC15tClient`, `ok` and `err`.\n\nSee [Migrate to v3](https://c15t.com/docs/upgrade-v3#update-the-nodejs-sdk) for the full mapping.\n\nConsent checks reject malformed results or missing requested policy types as `UNEXPECTED_RESPONSE`. Non-serializable request bodies and invalid per-call timers return `INVALID_INPUT`. Timeouts accept integers from 1 to 2147483647 milliseconds; retry delays accept integers from 0 to 2147483647. Invalid client settings throw `C15tConfigurationError`. Unknown stale-policy reasons are exposed as `undefined`.\n\nReject impossible calendar dates before publishing legal documents or querying experiment summaries. Manifest responses require schema version 2, a string revision and a supported branding value; invalid responses return `UNEXPECTED_RESPONSE`.\n"
    filename: 2026-10-02-node-sdk-v3-client.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/nextjs\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n  \"@c15t/schema\":\n    type: patch\n---\n\n### Resolve a relative backendURL against the request, not forwarding headers\n\nA relative `backendURL` or `manifestURL` no longer resolves against client-controlled forwarding headers. The server helpers previously built the backend origin from `x-forwarded-host`, `x-forwarded-proto` or `referer` when present, so a request that set them could make the server send its `/init` or manifest request, with the request's cookies and forwarded headers, to another host.\n\nA relative URL now resolves against the URL the framework resolved the request under (`event.url` in SvelteKit, `request.url` in Next.js route handlers, TanStack Start and Astro), or against the `host` header where no request URL exists (Next.js `resolveConsent`, `fetchSSRData`). A bare `host` resolves over `https` for a domain name and over `http` for `localhost`, an IP address, or a single-label host such as `app:3000`. The `referer` header is no longer used.\n\nApps behind a proxy that sets forwarding headers and drops incoming ones can opt back in with `trustForwardedHeaders: true` on SvelteKit `loadConsent` and `resolveConsent`, Next.js `resolveConsent`, `createNextConsentRouteHandlers` and `createPagesApiHandlers`, and `@c15t/react/server` `fetchSSRData` and `normalizeBackendURL`, matching the existing TanStack Start option. The rule lives in `resolveRequestBackendURL` and `resolveRequestOrigin`, new exports of `@c15t/core/server`, which every server adapter now shares. With the option set, the forwarded host and the forwarded scheme apply independently, so a proxy that keeps `host` and only sets `x-forwarded-proto` or `x-forwarded-ssl` still decides the scheme.\n\nThe SvelteKit and `@c15t/react/server` helpers also stop passing the client's `forwarded`, `x-forwarded-host` and `x-forwarded-proto` headers to the backend, including when `forwardHeaders` names them in SvelteKit. `extractRelevantHeaders` in both packages leaves them out unless called with `{ trustForwardedHeaders: true }`. `fetchSSRData` still makes its `/init` request when those headers are the only ones besides `host`; it just does not forward them.\n\n`resolveBackendURL` from `@c15t/schema/types` is deprecated in favor of `resolveRequestBackendURL`. It now follows the same rule by default: it reads only the `host` header, and ignores `x-forwarded-*` and `referer` unless its new third argument is `{ trustForwardedHeaders: true }`, which restores the previous resolution order. The forwarded values are now validated like `host`: the first entry of a comma-separated list is used, a scheme other than `http` or `https` is ignored, and a host that is not a bare authority resolves to `null`.\n"
    filename: 2026-09-30-relative-backend-url-origin.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n---\n\n### Forward consent saves through the SvelteKit consent route\n\n`createSvelteKitConsentRouteHandlers` answered `GET` only, so a provider\nusing `hosted({ url: '/api/c15t' })` got `405` on every save. Pass\n`proxy: true` and the handlers add `POST`, `PATCH`, `PUT`, `DELETE` and\n`OPTIONS`, which forward to `backendURL`. `GET` forwards paths other than\n`init` and `manifest`, which are still resolved in-process. Only those\nexact rest paths stay local, so a `paths` entry such as `reports/manifest`\nis forwarded. Export all six from the catch-all route:\n\n```ts\n// src/routes/api/c15t/[...path]/+server.ts\nexport const { GET, POST, PATCH, PUT, DELETE, OPTIONS } =\n\tcreateSvelteKitConsentRouteHandlers({ backendURL, proxy: true });\n```\n\nThe option and its rules match `createConsentServerRoute({ proxy })` in\n`@c15t/tanstack-start`: only `subjects`, `subjects/:id`, `init`,\n`manifest`, `health`, `status` and any `paths` you add are forwarded, and\nanything else gets `404`. Cookies are forwarded only when `cookieNames`\nnames them. The client address comes from `event.getClientAddress()`, and\n`x-forwarded-host` and `x-forwarded-proto` from `event.url`.\n\nA relative `backendURL` or `manifestURL`, such as `/api/self-host`, is now\nfetched through `event.fetch`, so SvelteKit answers it in-process. The\nroute handlers used to resolve it against `event.url`, which on\nadapter-node without `ORIGIN` takes its host from the client's `Host`\nheader, so a forged header could send the manifest, init or proxied\nrequest to a host of the client's choosing and return its response. The\n`fetch` option now applies to absolute URLs only.\n\nTo a remote backend over plain `http:`, the proxy sends only the public\nbrowser headers: no cookies, no custom headers and no `x-forwarded-for`.\nSuch a backend no longer sees the visitor's IP address, so it cannot use it\nfor geolocation or rate limiting; use an `https:` backend URL to keep it.\nLoopback `http:` backends still receive all three.\n\nThe proxy rules now live in `@c15t/core/server` as `forwardConsentRequest`,\n`resolveConsentProxyOptions`, `isConsentProxyPathAllowed` and related\nhelpers, and both adapters use them. Each adapter supplies only what its\nframework can trust for the forwarding headers. Both proxies now answer\n`504` with a JSON body when the backend misses the deadline and `502` when\nit cannot be reached, instead of a framework error page. They also stop\npassing `TE`, `Trailer` and any header the backend's `Connection` value\nnames on to the browser. TanStack Start's proxy otherwise behaves as\nbefore.\n"
    filename: 2026-09-29-sveltekit-route-proxy.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Support SvelteKit 3\n\n`@c15t/svelte` now accepts `@sveltejs/kit` 2 or 3 as a peer dependency. Before, npm refused to install it next to SvelteKit 3 with an `ERESOLVE` peer conflict.\n\n`c15tHandle()` now returns its own `C15tHandle` type, exported from `@c15t/svelte/kit`, instead of SvelteKit's `Handle`. SvelteKit 3 moved `Handle` from `@sveltejs/kit` to `@sveltejs/kit/hooks`, so with the default `skipLibCheck` the old return type became `any` in SvelteKit 3 apps. `C15tHandle` is assignable to `Handle` in both versions, so `export const handle = c15tHandle()` and `sequence(c15tHandle(), yourHandle)` work unchanged.\n\nSvelteKit 3's Cloudflare adapter no longer exposes `waitUntil` on `event.platform`, and its Vercel adapter has no edge runtime. On those platforms, pass the platform's `waitUntil` as `onBackgroundRevalidate` to `createSvelteKitConsentRouteHandlers`, so background manifest refreshes and visit reports finish after the response:\n\n```ts title=\"src/routes/api/c15t/[...path]/+server.ts\"\nimport { createSvelteKitConsentRouteHandlers } from '@c15t/svelte/kit';\nimport { waitUntil } from 'cloudflare:workers'; // Vercel: '@vercel/functions'\n\nexport const { GET } = createSvelteKitConsentRouteHandlers({\n\tbackendURL: 'https://your-project.inth.app',\n\tonBackgroundRevalidate: (promise) => waitUntil(promise),\n});\n```\n\nIf you pass `loadConsent` a relative `backendURL` together with your own `fetch`, the call goes to the origin of `event.url`. SvelteKit 3's `adapter-node` ignores the `ORIGIN` environment variable without a warning and takes the host from the `Host` header instead, so move `ORIGIN` to `paths.origin` in the `sveltekit()` options, or pass an absolute `backendURL`.\n\nIf you self-host `@c15t/backend` inside a SvelteKit 3 route, import it dynamically in the route. A static import can fail the build with `Invalid export` for that route. See the [self-hosting quickstart](https://c15t.com/docs/self-host/quickstart#sveltekit).\n"
    filename: 2026-10-01-sveltekit-3.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Apply every `theme.slots` style in Svelte\n\nEvery stock banner, dialog and preference widget part now takes both the classes and the `style` of its slot. Svelte used to drop `style` on most parts, write camelCase keys such as `backgroundColor` as invalid CSS, ignore `consentDialogOverlay`, and give legal links the classes of the description slot around them. `consentWidgetAccordion` and `toggle` now reach the category list and the category switches, and the IAB banner and dialog now apply their root, card, header and footer slots. Legal links now keep only their stock class, as in React and Vue.\n\nNumeric `style` values get `px` where the property takes a unit, as in React: `{ padding: 8 }` renders `padding:8px`, and unitless properties such as `opacity` or `zIndex` keep the bare number.\n"
    filename: 2026-09-30-svelte-theme-slots.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Mirror a `.dark` class when `colorScheme` is unset in Svelte\n\n`ConsentManagerProvider` with no `colorScheme` now copies a `dark` class on `<html>` into `c15t-dark` and follows it as it changes, as the React and Vue providers do. Before, an unset `colorScheme` left `c15t-dark` alone, so a site theme switch that toggled `dark` never reached the consent UI. Pass `colorScheme: null` to keep managing `c15t-dark` yourself.\n"
    filename: 2026-09-30-svelte-color-scheme-mirror.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Accept `disableAnimation` on the Svelte dialogs\n\n`ConsentDialog` and `IABConsentDialog` take a `disableAnimation` prop that overrides the provider's `disableAnimation` for that dialog, as `ConsentBanner` and the React dialogs already do.\n\nThe IAB dialog's backdrop now fades in when the dialog opens, like the consent dialog's and the banners'. It used to appear at full opacity at once. `disableAnimation` on the dialog or the provider turns the fade off, and so does a reduced-motion preference.\n"
    filename: 2026-09-30-svelte-dialog-disable-animation.md
    v: 0.0.0
  - content: "---\npackages:\n  c15t:\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/tanstack-start\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/cli\":\n    type: minor\n---\n\n### Pass the backend URL to the server helpers\n\n**Breaking.** The server helpers no longer read c15t configuration from environment variables. Pass `backendURL` or `manifestURL` to them. If you keep the URL in an environment variable, read it in your own code and pass the value.\n\n| Helper | No longer read |\n| --- | --- |\n| `createNextConsentRouteHandlers`, `createPagesApiHandlers` (`c15t/next/api`, `c15t/next/pages`) | `C15T_BACKEND_URL`, `NEXT_PUBLIC_C15T_BACKEND_URL`, `C15T_MANIFEST_URL`, `C15T_MANIFEST_REVALIDATE_SECONDS` |\n| `createConsentServerRoute` (`c15t/tanstack-start/api`) | `C15T_BACKEND_URL`, `VITE_C15T_BACKEND_URL`, `C15T_MANIFEST_URL` |\n| `createSvelteKitConsentRouteHandlers` (`@c15t/svelte/kit`) | `C15T_BACKEND_URL`, `C15T_MANIFEST_URL` |\n| `manifest()` mode and its injected routes (`c15t/astro`) | `C15T_BACKEND_URL`, `PUBLIC_C15T_BACKEND_URL`, `C15T_MANIFEST_URL` |\n\nThese helpers now take a required options argument. Without `backendURL` or `manifestURL`, each request throws, for example `@c15t/nextjs/api: pass backendURL or manifestURL.` Astro's `manifest()` without a `backendURL` or an inline `manifest` fails when `astro.config` loads. `manifestRevalidateSeconds` defaults to `300`.\n\nThe ready-made handlers built from environment variables are removed: `GET` and `manifestGET` from `c15t/next/api` and `@c15t/nextjs/api`, and `GET`, `manifestGET` and `initGET` from `c15t/tanstack-start/api` and `@c15t/tanstack-start/api`.\n\nBefore:\n\n```ts title=\"app/api/c15t/manifest/route.ts\"\nexport { manifestGET as GET } from 'c15t/next/api';\n```\n\nAfter:\n\n```ts title=\"app/api/c15t/manifest/route.ts\"\nimport { createNextConsentRouteHandlers } from 'c15t/next/api';\n\nimport { consentConfig } from '@/c15t.config';\n\nexport const { manifestGET: GET } =\n\tcreateNextConsentRouteHandlers(consentConfig);\n```\n\nThe init route takes `GET` from the same call. You can pass options instead of a config, for example `createNextConsentRouteHandlers({ backendURL: 'https://your-project.inth.app' })`.\n\n`c15t setup` writes the chosen backend URL into the generated components, `c15t.config.ts` and the `next.config` rewrite as a string. Quotes and backslashes in the URL are escaped, so they no longer break the generated `next.config`. It no longer writes `.env.local` or `.env.example`, no longer asks whether to store the URL in a `.env` file, and no longer accepts `--env`.\n"
    filename: 2026-09-30-explicit-backend-url.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Remove the unused `policyRules` option from `ConsentManagerProvider`\n\n`ConsentManagerOptions` accepted `policyRules`, but no Svelte transport read\nit: `offline()` resolved its own rules or the recommended pack, so rules\npassed to the provider were ignored without a warning. The option is gone\nfrom the type, which matches `ConsentProvider` in `@c15t/react`. Pass rules\nto the transport instead:\n\n```svelte\n<ConsentManagerProvider mode={offline({ policyRules: [rule] })}>\n```\n\nCode that passed `policyRules` to the provider now fails type checking.\nIts behavior does not change, because the option never had an effect.\n"
    filename: 2026-09-30-svelte-provider-policy-rules.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Warn in development when `theme` tokens have nowhere to apply\n\n`ConsentManagerProvider` applies slots and `consentActions` from `theme`,\nbut it does not turn colors, radii, typography, spacing, shadows or motion\ninto CSS in the browser. Passing them without a stylesheet did nothing and\nsaid nothing. In development the provider now logs a warning when `theme`\nhas tokens and the page has no `<style id=\"c15t-theme\">`. The warning\nsays to put the `--c15t-*` variables, or the CSS from `generateThemeCSS`,\nin your stylesheet and drop the tokens from `theme`. An app that already\ncompiles its theme into a stylesheet silences it the same way. Production\nbuilds skip the check.\n"
    filename: 2026-09-29-svelte-theme-token-warning.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Keep a `ConsentDialog` held open by `open` on screen after Escape\n\nWith `open={true}`, pressing Escape closed the dialog, which then mounted\nagain as a new element and moved focus. The dialog now follows `open`, as\n`ConsentDialog` does in `@c15t/react`: Escape sets the active UI to `'none'`,\nand the dialog stays until `open` turns `false`. Without `open`, Escape\ncloses the dialog as before.\n"
    filename: 2026-09-30-svelte-controlled-dialog-escape.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Add trigger slots and keep slot classes under `noStyle`\n\n`theme.slots` gains `consentDialogTrigger` and `consentDialogTriggerIcon` for the floating button that reopens the preference center and its icon, the parts React and Vue style with `components.trigger.root` and `components.trigger.icon`. The Svelte `ConsentDialogTrigger` applies both, including a slot's `style`.\n\n`resolveStyles` now keeps theme slot classes and styles under `noStyle` and drops only the stock classes. Before, a component that passed its own `noStyle` flag lost the theme slot's classes, and one that passed a `baseClassName` kept the stock class. In `@c15t/svelte`, the banner, dialog and widget parts now keep their `theme.slots` classes when `noStyle` is set, and the widget's footer button group reads `consentWidgetFooterSubGroup` instead of `consentWidgetFooter`.\n"
    filename: 2026-09-30-trigger-slots-and-no-style.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Apply `theme.slots` to the Astro banners and dialog islands\n\n`<ConsentBanner />` and the banner the browser renders on prerendered pages now read `theme.slots` for their parts: `consentBanner`, `consentBannerCard`, `consentBannerHeader`, `consentBannerTitle`, `consentBannerDescription`, `consentBannerFooter`, `consentBannerFooterSubGroup`, `consentBannerRights`, `consentBannerRightLink`, `consentBannerTag`, `consentBannerOverlay`, `buttonPrimary` and `buttonSecondary`. Before, the banner read only `theme.consentActions`, so classes and styles set there were ignored. A slot's classes follow the stock ones, its `style` renders inline, and `noStyle: true` on a slot replaces that part's stock classes.\n\n`<IABConsentBanner />` and its browser-rendered copy read `iabConsentBanner`, `iabConsentBannerCard`, `iabConsentBannerHeader`, `iabConsentBannerFooter`, `iabConsentBannerTag`, `iabConsentBannerOverlay`, `buttonPrimary` and `buttonSecondary` the same way.\n\nThe preference and IAB dialogs now honor `theme.slots` with `ui: 'react'` and `ui: 'vue'` too. Those islands style parts through the provider's `components` option, so the integration translates each slot to its `components` entry (`consentDialogCard` to `dialog.card`, `toggle` to `switch.root`, and so on). A slot's `noStyle` flag has no `components` equivalent there: its classes apply on top of the stock ones. The Svelte island already read `theme.slots`.\n\nNumeric slot `style` values get `px` where the property takes a unit (`{ padding: 8 }` renders `padding:8px`), and unitless properties such as `opacity` or `zIndex` keep the bare number. The banners now apply the assigned experiment arm's `theme.slots` and `consentActions` over the host theme's, on the server and in the browser-rendered copy. The browser-rendered copy also applies the arm's `presentation`, as the server render already did.\n"
    filename: 2026-09-30-astro-banner-slots.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Accept every banner prop on `ConsentBannerDeferred`\n\n`ConsentBannerDeferred` now accepts `dismissButtonText` and `hideBranding` in its prop types. It already passed them to `ConsentBanner`, but `astro check` rejected them.\n"
    filename: 2026-09-29-astro-deferred-banner-props.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Export the Astro dialog stylesheets\n\nWith `styles: false`, import the preference dialog's rules from `@c15t/astro/dialog.css` (`c15t/astro/dialog.css` in the umbrella package). The Svelte dialog also needs `@c15t/astro/primitives.css` (`c15t/astro/primitives.css`). You no longer need to install `@c15t/ui` to import `@c15t/ui/styles/dialog.css` and `@c15t/ui/styles/primitives.css`.\n\n```css\n@import 'c15t/astro/styles.css';\n@import 'c15t/astro/dialog.css';\n@import 'c15t/astro/primitives.css';\n```\n"
    filename: 2026-09-29-astro-dialog-css.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Keep the Astro color scheme when a dialog opens\n\nWith `colorScheme: 'dark'` or `'system'`, opening the preference dialog with `ui: 'react'` removed `c15t-dark` from `<html>` unless the page also had a `dark` class, so the banner and dialog turned light. The dialog islands now leave the class to the page's colour-scheme setting. The provider option types in `@c15t/react` and `@c15t/ui` now accept `colorScheme: null`, which the providers already treated as \"leave the class alone\".\n\nSet `colorScheme: 'none'` when your site's own theme switch sets `c15t-dark`. c15t then emits no colour-scheme script and never adds or removes the class, on boot, after ClientRouter navigations or when a dialog opens.\n"
    filename: 2026-09-28-astro-dialog-color-scheme.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Keep c15t styles above Tailwind v4 preflight\n\nThe layered stylesheets (`styles.css`, `styles/dialog.css`, `styles/primitives.css` and `iab/styles.css`) and `@c15t/astro/styles.css` now open with Tailwind v4's layer order, `@layer properties, theme, base, components, utilities;`. Cascade layers rank by the order they are first named, so a page that loaded c15t's stylesheet before Tailwind's put `components` below Tailwind's `base`, and preflight removed the banner's padding and borders. This happened on Astro sites using Tailwind v4, where the integration injects c15t's stylesheet first, and in apps that import c15t's stylesheet above their own. The order now holds whichever sheet loads first.\n\nWithout Tailwind the extra layers stay empty. If your CSS declares its own layer order, load that statement before c15t's stylesheet. The `.tw3.css` files are unchanged, and `@c15t/ui/postcss-tailwind3` removes the statement for Tailwind 3.\n"
    filename: 2026-09-28-ui-cascade-layer-order.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Apply theme.consentActions to the Astro banner\n\n`<ConsentBanner />` now reads `consentActions` from the integration's `theme` and sets each button's mode and variant in the same order as the React banner: the action's own key, then `primary` for the policy's primary action, then `default`. Before, every button was a stroke button and only the primary action got the primary variant. The banner the browser renders on prerendered hosted and manifest pages uses the same styles.\n\nOn a notice, the acknowledgement button is now the primary action when it is the only button, as it is in the React and Svelte banners.\n"
    filename: 2026-09-28-astro-banner-consent-actions.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Accept `colorScheme: null` in Astro\n\nThe integration's `colorScheme` accepts `null` with the same meaning as `'none'`: c15t neither sets nor clears `c15t-dark` on `<html>`. `null` is the value the React, Vue and Svelte providers use for this, so a shared config works in all of them. The default stays `'system'`.\n"
    filename: 2026-09-30-astro-color-scheme-null.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Add `disableAnimation` to Astro\n\nThe integration accepts `disableAnimation`. It skips the banner's entry animation, in the server markup and in a banner the browser renders, and the dialog islands' enter and exit animations. `<ConsentBanner />`, `<IABConsentBanner />`, `<ConsentDialog />` and `<IABConsentDialog />` take the same prop to override it for one surface.\n\n```astro\n<ConsentBanner disableAnimation />\n```\n\nLeft unset, animations play, and the stylesheet stops them for visitors who ask for reduced motion, as before.\n"
    filename: 2026-09-30-astro-disable-animation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Require a backend URL in Astro manifest mode\n\n`manifest()` without a `backendURL` now fails when `astro.config` loads, with an error that says where to set one. Before, only a `manifestURL` without a `backendURL` was caught. A bare `manifest()` built, then the browser posted every save to `/api/c15t/subjects`, where nothing answers, so consent was never recorded.\n\n`C15T_BACKEND_URL` or `PUBLIC_C15T_BACKEND_URL`, when set as `astro.config` loads, still counts. Its value is now passed to the browser as well, so saves go to that backend. An inline `manifest` without a `backendURL` still builds. `backendURL: ''` counts as set: the browser posts saves to `/subjects` on the site's own origin, and the environment variables do not replace it. It gives the server no manifest to fetch, so pair it with a `manifestURL`, an inline `manifest` or `C15T_MANIFEST_URL`; without one, `astro.config` fails to load.\n"
    filename: 2026-09-29-astro-manifest-backend-url.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Support nonce- and hash-based Content Security Policies in Astro\n\nSet `Astro.locals.c15t.nonce` from your own middleware, which runs after c15t's, and every inline `<script>` and `<style>` the c15t components render carries it. In the browser, the runtime puts the same nonce on the scripts its loader injects, on gated `type=\"text/plain\"` scripts it activates, and on the dialog stylesheets it links.\n\n```ts\n// src/middleware.ts\nimport { defineMiddleware } from 'astro:middleware';\n\nexport const onRequest = defineMiddleware(async (context, next) => {\n\tconst nonce = crypto.randomUUID();\n\tif (context.locals.c15t) {\n\t\tcontext.locals.c15t.nonce = nonce;\n\t}\n\tconst response = await next();\n\tresponse.headers.set(\n\t\t'content-security-policy',\n\t\t`script-src 'self' 'nonce-${nonce}'; style-src 'self' 'nonce-${nonce}'`\n\t);\n\treturn response;\n});\n```\n\nWith Astro's `<ClientRouter />` and a nonce generated per request, each page the router swaps in arrives with a new nonce, while the browser keeps enforcing the first page's policy. Before the swap, the runtime gives c15t's own inline scripts and theme stylesheet on the new page, and its gated `data-c15t-category` tags, the first page's nonce when they carry the incoming one, so c15t's inline code still runs and the gated tags still pass the nonce check. Other elements keep their nonce. c15t's inline scripts now carry a `data-c15t-inline` attribute for this. If the incoming page has config scripts with different nonces, as when markup injected into it plants a second one, the runtime changes nothing on that page and logs a warning.\n\n`<ConsentBannerDeferred />` passes the page's nonce to its server island, because the page's policy is the one that applies to the markup the island inserts. `<ConsentBanner />` takes the same value as a `nonce` prop. Astro's own island loader is an inline script without a nonce, so a nonce-only policy still blocks the island until the policy allows that script too.\n\nWith Astro's own CSP turned on (`security.csp`, or `experimental.csp` in Astro 5), the integration adds the hashes of the colour-scheme script, the banner reveal scripts, the theme stylesheet and inline `scripts` entries to it. With an `experiment`, it hashes the theme stylesheet of every arm, since an arm's `theme` changes the stylesheet the banner renders. You no longer need `'unsafe-inline'`.\n\nInline `scripts` from a `clientEntrypoint` module are the one exception: that module only runs in the browser, so the integration cannot hash them when Astro loads the config. With Astro's CSP on, the browser now hashes each of them and logs a console error naming the script and the hash the policy lacks. Add that hash to `scriptDirective.hashes` in the `csp` config, or move a script that has no callbacks into the integration's `scripts` option, which c15t hashes for you.\n\nThe per-visitor boot payload now renders as a `<script type=\"application/json\" data-c15t-config>` data block, which a policy does not need to allow, instead of a script that assigns `window.__c15tAstroConfig`. `buildConfigJSON()` from `@c15t/astro/server` builds it. A page that still sets `window.__c15tAstroConfig` with `buildConfigScript()` keeps working, and the runtime reads the nonce from that script when it has one.\n\nPut the page's nonce on your own gated tags too: `<script is:inline type=\"text/plain\" data-c15t-category=\"measurement\" nonce={Astro.locals.c15t.nonce}>`. c15t activates a gated tag by creating a new `<script>`, and a policy with `'strict-dynamic'` runs a script that a trusted script creates without checking its nonce. So a tag injected into the page through an HTML-injection hole would run as soon as its category was granted. When the page has a nonce, the runtime activates only tags carrying it, with that nonce. It skips the others, marks them `data-c15t-activated=\"untrusted\"` and logs a warning. Pages without a nonce behave as before.\n"
    filename: 2026-09-30-astro-csp.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Deep-merge `i18n.messages` in Astro\n\n`i18n.messages` now merges each translation group key by key, as the other adapters do. Overriding `common.acceptAll` alone used to replace the whole `common` group, so every other button label rendered empty.\n"
    filename: 2026-09-29-astro-deep-merge-messages.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/astro\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Label Astro legal links and show them in the preference dialog\n\nA legal link with no `label` in `legalLinks` now reads as the translated name for its type, such as \"Privacy Policy\" or \"Datenschutzerklärung\", instead of the raw key `privacyPolicy`. The React, Vue and Svelte banners already did this.\n\n`<ConsentDialog />` takes a `legalLinks` prop with the same list `<ConsentBanner legalLinks>` takes, and passes it to the Svelte, React or Vue dialog island. Before, the Astro preference dialog never showed legal links.\n\n```astro\n<ConsentDialog legalLinks={['privacyPolicy', 'cookiePolicy']} />\n```\n"
    filename: 2026-09-30-astro-legal-links.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/tanstack-start\":\n    type: patch\n---\n\n### Require a TanStack Start release with the server-function XSS fix\n\nThe `@tanstack/react-start` peer range now starts at 1.168.60, and `@tanstack/react-router` at 1.170.41, the release Start 1.168.60 pins. Earlier Start releases from 1.143.12 are affected by CVE-2026-102989, a reflected XSS in server-function responses (GHSA-qx66-fv34-fjm8). Package managers now warn when an app installs `@c15t/tanstack-start` next to an affected Start release. Upgrade both packages together.\n"
    filename: 2026-10-01-tanstack-start-xss-floor.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/nextjs\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n---\n\n### Load new copy from `useSetLanguage()` and fix composed banner parts\n\n`useSetLanguage()` now runs init again after storing the language, so the banner and dialog switch to that language without a separate `init()` call. Setting the current language does nothing, and a disabled provider stores the language without running init. With a `runtime` passed to `ConsentProvider`, the runtime reinitializes itself.\n\nThe React `offline()` mode, also exported by `@c15t/nextjs` and `@c15t/tanstack-start`, is now core's `offline()`. A language from `useSetLanguage()` or `overrides.language` switches the copy when the bundled translations or `i18n.messages` have that language, and a language with no copy keeps the default copy. The language a server prefetch detected from `Accept-Language` still does not switch the copy, including when `prefetch` is a pending promise.\n\n`ConsentProvider` logs a development warning when `options.callbacks` is passed together with `runtime`. The runtime runs the callbacks its owner passed to `createConsentRuntime({ callbacks })`, and the provider's own callbacks were dropped without notice. The options type for a borrowed runtime now rejects `callbacks`.\n\nComposed banner parts:\n\n- `ConsentBanner.Card` fills a callback ref and keeps its focus trap. Before, a callback ref replaced the ref the trap read, so a blocking card did not trap focus.\n- `ConsentBanner.Title` and `ConsentDialog.HeaderTitle` with `asChild` render the child element, such as an `h1`, in place of the `h2`. Before, the child was nested inside the `h2`. `ConsentBanner.Overlay` now honors `asChild` too. `ConsentBanner.Description` and `ConsentDialog.HeaderDescription` with `asChild` and no child element render their default markup instead of nothing.\n- `ConsentBanner.AcceptButton`, `RejectButton` and `CustomizeButton` placed by hand now carry `data-action=\"accept\"`, `\"reject\"` and `\"customize\"`, as they do in the stock banner, and pick up `theme.consentActions.accept`, `.reject` and `.customize`. An explicit `data-action` or `consentAction` prop still wins.\n"
    filename: 2026-09-30-react-language-and-compose.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/nextjs\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Load only the dialog link from its subpath\n\n`@c15t/nextjs/components/consent-dialog-link`, `@c15t/tanstack-start/components/consent-dialog-link` and their `c15t/next` and `c15t/tanstack-start` equivalents now export only `ConsentDialogLink`. They pointed at the whole adapter entry, so importing the link pulled in the rest of the adapter.\n"
    filename: 2026-09-29-nextjs-dialog-link-entry.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/nextjs\":\n    type: patch\n  \"@c15t/tanstack-start\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Resolve unknown locations on static pages with the manifest's own policy\n\n`createStaticConsentResolver` from `@c15t/tanstack-start/static` now starts a visitor with no known location on the manifest's unknown-location policy (its `fallback` pack, else its `default` pack), as `@c15t/nextjs/static` already did and as server rendering does when location headers are missing. It previously picked the strictest pack in the manifest and applied it to everyone, including packs scoped to other countries. A manifest with no fallback or default pack now resolves to a failed `insufficient-inputs` result, and the client applies its safe fallback.\n\nGeo data that isn't a non-empty string, such as a numeric `country` or a blank `regionCode` from the geo endpoint, now counts as an unknown location. It previously reached the policy resolver and could end up in `location.countryCode`. String values are trimmed.\n\nThe static resolver now lives in `@c15t/core/static` (also available as `c15t/static`), and both framework `static` entries re-export it. `resolveStrictestDefaultInit` is renamed to `resolveUnknownLocationInit`. The old name still works in `@c15t/nextjs/static` and `@c15t/tanstack-start/static` and is marked deprecated.\n"
    filename: 2026-09-29-static-unknown-location-policy.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n---\n\n### Keep blocking iframes past an unreadable iframe or an empty category\n\nThe iframe blocker now skips an iframe the page can't read, not only an unreadable node that contains it. Before, one such iframe made `createIframeBlocker` throw on startup and stopped each later pass early, so other consent-gated iframes loaded. The on-demand watcher in `@c15t/react` had the same gap.\n\nAn empty `data-category` is now treated like an unknown category: the iframe stays blocked and logs a console warning. Before, it counted as no category, so the iframe loaded without consent.\n"
    filename: 2026-09-28-iframe-blocker-unreadable-iframes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n---\n\n### Gate iframes after a client router replaces the page body\n\nThe iframe blocker now watches the document root instead of the `<body>` it saw at startup. Astro's `ClientRouter` and Turbo replace `<body>` on navigation, so gated iframes on a page reached by client-side navigation used to keep their `data-src` after consent was granted, and kept loading their `src` after it was denied, until the next consent change. The blocker also now starts watching when it runs from a script in `<head>`, before `<body>` exists.\n"
    filename: 2026-09-30-iframe-blocker-body-swap.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Migrate Node module imports to the integrations package\n\nThe `scripts-to-integrations` codemod now recognizes `require` functions\ncreated by Node's imported `createRequire()`, including aliased imports. It\nleaves custom functions and shadowed parameters unchanged. Codemods also scan\n`.mts`, `.cts`, `.mjs`, and `.cjs` source files.\n"
    filename: 2026-09-30-integrations-codemod-require.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/cli\":\n    type: minor\n---\n\n### Native frontend workflows, `setup --codex`, and Inth accounts\n\n**Breaking:** account commands now run through Inth. `c15t login`, `logout`,\n`status`, and `projects` use the bundled Inth executable and share its session\nwith the `inth` CLI. The `authenticate` export is removed, and control-plane\nadapters take a working directory, organization, and abort signal instead of\ntokens or an API URL. Sessions stored in `~/.c15t/config.json` are no longer\nread; run `c15t login` again. `c15t logout` deletes that file.\n\nInth ships binaries for macOS on Apple silicon, glibc Linux on x64 and arm64,\nand Windows on x64. On other platforms, including Intel Macs and Alpine, account\ncommands fail with `INTH_UNSUPPORTED_PLATFORM`. Pass `--backend-url` or use\noffline mode there.\n\nFor agents and CI, `c15t login --email <email>` prints an approval URL and code,\nand `c15t login --complete` finishes sign-in. `INTH_TOKEN` also works.\n\n`c15t setup --codex` hands frontend setup to the Codex CLI. Add `--plan` to\nprint the task and copy it to the clipboard instead, or `--plan --json` to\nget it as JSON.\n\nNew exports let other CLIs run c15t frontend setup without Node:\n\n- `@c15t/cli/generate` builds generation plans.\n- `@c15t/cli/frontend` handles setup, project selection, and status with\n  host-supplied state.\n- `@c15t/cli/frontend/runtime` applies plans to disk, recovers interrupted\n  applies, and installs packages with npm, pnpm, yarn, or Bun.\n- `@c15t/cli/frontend/agent` builds and launches the Codex task.\n- `@c15t/cli/commands` exposes the command registry.\n\nThe generate and frontend modules also ship as TypeScript source for static\ncompilation. Generated installs follow the CLI's release line.\n\nCodex launch and native dependency installation support macOS and Linux. On\nWindows, use `--plan` and `--skip-install`.\n"
    filename: 2026-10-01-native-cli-generation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Use `styles.css` with Tailwind 3\n\nTailwind 3 apps now import the same stylesheet as every other setup, such as `c15t/react/styles.css` or `c15t/next/styles.css`, and run `@c15t/ui/postcss-tailwind3` before `tailwindcss`. The plugin previously skipped the entry stylesheets, so Tailwind 3 apps had to pick `styles.tw3.css`, and the dialog stylesheet still needed the plugin. It now also flattens `styles.css` and `iab/styles.css`, handles c15t rules that Vite or `postcss-import` inline into your own stylesheet, and covers `@c15t/browser/styles.css` for light-DOM setups, where Tailwind 3 previously dropped the rules without an error and its preflight stripped the banner's button padding and borders.\n\n```js title=\"postcss.config.mjs\"\nexport default {\n\tplugins: {\n\t\t'@c15t/ui/postcss-tailwind3': {},\n\t\ttailwindcss: {},\n\t\tautoprefixer: {},\n\t},\n};\n```\n\nUse the object form: Vite's PostCSS config loader rejects plugin names in an array.\n\nImport the stylesheet above your `@tailwind` directives. `postcss-import` ignores an `@import` that follows other rules, so the previously documented position between `@tailwind components` and `@tailwind utilities` dropped the c15t rules in Vite apps. When the plugin is missing, Tailwind 3's build error now shows a comment naming it.\n\n`c15t setup` now imports `styles.css` for Tailwind 3 and adds the plugin to your PostCSS config, replacing an existing `styles.tw3.css` import. Before this, it imported `styles.tw3.css` without the plugin, and the build failed on the dialog stylesheet. Setup also installs `@c15t/ui`, so pnpm can resolve the plugin. It edits the active plugin list, including `[name, options]` tuples, and ignores commented-out examples. If the config passes an imported `tailwindcss` binding, lists the c15t plugin after `tailwindcss`, or has no single plugin list to edit, if `package.json` holds the PostCSS config, or if several config files exist, setup prints the change to make instead of guessing which one your build reads. The v1 to v2 `add-stylesheet-imports` codemod keeps importing `styles.tw3.css`, because the plugin does not exist in v2.\n\n`styles.tw3.css` and `iab/styles.tw3.css` still ship and work with the plugin.\n"
    filename: 2026-09-28-tailwind3-single-stylesheet.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Warn that Create React App cannot run the Tailwind 3 plugin\n\nCreate React App (`react-scripts`) builds CSS with its own PostCSS setup and never reads `postcss.config.js`, so c15t's Tailwind 3 PostCSS plugin (`c15t/postcss-tailwind3`) cannot run and a Tailwind 3 build fails on c15t's dialog stylesheet. `c15t setup` still added the plugin to a `postcss.config.js` it found and reported success.\n\nFor Tailwind 3 apps that depend on `react-scripts`, setup now leaves PostCSS config alone, with or without a config file, and warns instead. To fix the build, add the plugin before `tailwindcss` through CRACO, eject, or move the app to Vite.\n\nInteractive setup now shows this warning and the existing \"add the plugin by hand\" step, which it previously logged only at debug level. `--non-interactive` setup logs them and returns them in a new `warnings` array, which `--json` output includes.\n"
    filename: 2026-10-01-cli-create-react-app-tailwind3.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Install c15t packages that match the CLI\n\n`c15t setup --apply` and the interactive setup now install c15t packages from the CLI's own release line instead of npm `latest`. A prerelease CLI installs every c15t package from its dist-tag, for example `c15t@alpha` from a 3.0.0 alpha CLI. A stable CLI pins only the packages released together with it, such as `c15t` and `@c15t/dev-tools`, to its major version, for example `c15t@3`. Packages that version on their own, such as `@c15t/ui`, `@c15t/integrations` and `@c15t/svelte`, install from `latest` on a stable CLI. Rerunning setup keeps c15t packages the app already declares on the same release line. A c15t package declared on another major or prerelease channel, such as `@c15t/react@^2` in a v2 app, is installed again from the CLI's line so it matches the code setup writes. Compound ranges such as `>=2 <3` and `^2 || ^3` count by the versions they admit. Under a prerelease CLI, a range that names no prerelease and also admits an earlier major, such as `>=2` or `*`, is installed again, because npm resolves it to the earlier stable release, and so is a dist-tag other than the CLI's own, such as `latest`. `workspace:`, `link:`, `file:` and `portal:` ranges are left as they are, and so are dist-tags under a stable CLI.\n\n`c15t generate` boilerplate now lists the same pinned install command for its c15t packages, and the generated README no longer says the files target unpublished APIs.\n"
    filename: 2026-09-29-cli-release-line.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Lay out banner actions by card width\n\nThe banner footer now switches layout on the card's width instead of the viewport's, so `--consent-banner-max-width` works on wide screens. A card narrower than 22rem puts Reject and Accept on one row and Customize on a full-width row below, where the buttons used to overflow the card. The default 440px card keeps its single row.\n\nThe `widget` chip is 20rem wide by default, so it now uses the same two-row footer on every screen size.\n"
    filename: 2026-09-28-banner-actions-card-width.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Unwrap every c15t stylesheet for Tailwind 3\n\n`@c15t/ui/postcss-tailwind3` now unwraps the `@layer` blocks of every built stylesheet a c15t package publishes, not only those of `@c15t/ui` and `@c15t/browser`. Two setups failed before:\n\n- `@import '@c15t/svelte/styles.css'` in an app stylesheet. Tailwind 3 treated c15t's rules as part of its own components layer and purged them, leaving the Svelte and SvelteKit banner unstyled.\n- `@c15t/astro/styles.css`, which Astro injects on every page. The Astro build failed with \"`@layer components` is used but no matching `@tailwind components` directive is present\".\n\nThe plugin also recognizes c15t stylesheets whose path carries a query, such as the `?transform-only` Astro adds to the dialog stylesheet.\n\nA stylesheet under `packages/<name>/dist/` of a workspace only counts as c15t's when that package's `package.json` is named `c15t` or `@c15t/*`. Before, any `packages/ui/dist` or `packages/browser/dist` stylesheet matched, so another monorepo's own packages could lose their `@layer` blocks.\n"
    filename: 2026-09-30-postcss-tailwind3-imported-sheets.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: minor\n---\n\n### Add CSS variables for the \"Secured by\" tag\n\nRestyle the branding tag on the banner and dialog with `--consent-branding-tag-background-color`, `--consent-branding-tag-border-color`, `--consent-branding-tag-text-color`, `--consent-branding-tag-mark-color` and `--consent-branding-tag-shadow`. `--consent-branding-tag-attached-edge-width` draws a border on the edge where the tag meets the card, which has none by default.\n\nWithout these variables set, the tag looks the same as before.\n"
    filename: 2026-09-28-ui-branding-tag-variables.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Remove unused banner card animation rules\n\nThe banner and IAB banner stylesheets no longer carry `.card[data-state]` animation rules or the `--consent-banner-entry-animation`, `--consent-banner-exit-animation`, `--iab-consent-banner-entry-animation` and `--iab-consent-banner-exit-animation` variables that fed them. No banner ever set `data-state` on its card, so the rules never applied. The banners animate through their visible, hidden and entering classes as before. The `iab-consent-banner.css` animations export keeps its keyframes.\n\n`setupColorScheme()` no longer throws where `matchMedia` is missing, as in some embedded webviews. `'system'` is light there. The motion token TSDoc now gives the real duration defaults: 80ms, 150ms and 200ms.\n"
    filename: 2026-09-30-ui-banner-card-animation.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Let the theme reach legal links, the ConsentGate placeholder and IAB highlights\n\nSeveral parts of the UI used fixed values instead of theme tokens, so a custom `theme` left them on c15t's defaults. They now follow the theme:\n\n- Legal links use `colors.primary`. In dark mode they use the dark primary, which is lighter than the previous fixed blue.\n- The ConsentGate placeholder takes its font, colors, radius and shadow from the theme.\n- The IAB dialog's selected-vendor banner and search focus ring are tints of `colors.primary` instead of a fixed blue.\n- A disabled switch's outline uses `colors.border`, so it no longer shows a light ring in dark mode.\n- The preference accordion and vendor list focus rings use `colors.primary`, with the same dark-mode fix as legal links. Their arrows and category descriptions are shades of `colors.textMuted`, matching the old greys with the default theme.\n- The dialog and banner entrance springs, accordion and collapsible fades, tab transitions and the placeholder fade-in use the `motion` easings and durations.\n- The IAB dialog title and banner title use `typography.fontSize.lg`, and the dialog footer and legal links use `fontSize.sm`.\n\nWith the default theme, the light-mode changes are small shifts in shade and easing.\n"
    filename: 2026-09-28-ui-theme-token-gaps.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n---\n\n### Use the theme font in the preference list\n\nThe preference list in the consent dialog and consent widget now uses `typography.fontFamily` from your theme, like the dialog's title and buttons. It used a fixed system font stack before, so a themed dialog showed its category rows in a different font.\n"
    filename: 2026-09-28-ui-manager-theme-font.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/react\":\n    type: patch\n---\n\n### Pass `colorScheme` through `generateThemeCSS` from `@c15t/react/utils`\n\n`generateThemeCSS(theme, colorScheme)` from `@c15t/react/utils` now takes the same `colorScheme` argument as the one in `@c15t/ui/theme` and writes the same CSS. It used to drop the argument, so `'dark'` and `'system'` produced light-only CSS.\n"
    filename: 2026-09-30-react-utils-theme-css-color-scheme.md
    v: 0.0.0
