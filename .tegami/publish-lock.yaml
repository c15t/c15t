core:changelogs:
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/dev-tools\":\n    type: patch\n---\n\n### Show the banner on pages that hide empty elements\n\nThe script-tag UI stayed hidden on pages with a rule such as\n`div:empty { display: none; }`, which Shopify's Dawn theme ships. The banner\nrenders into a shadow root, and shadow content doesn't count as a child, so the\npage rule matched the `<div data-c15t-ui>` host and hid it. c15t still reported\nthe banner as shown, so visitors saw nothing and no consent was saved.\n\nThe host now sets `display: block !important` inline, and page CSS can no longer\nhide it. The DevTools panel's host gets the same fix. With `shadow: false` the\nhost has child elements and keeps no inline display.\n"
    filename: 2026-10-24-ui-host-empty-selector.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n---\n\n### Load Databuddy after consent and turn off features you do not use\n\n`databuddy()` now waits for `measurement` consent before it loads\n`databuddy.js`, like most c15t analytics helpers. Until the visitor allows\nmeasurement, the page makes no request to Databuddy and Databuddy stores\nnothing in the browser. Pass `loadMode: 'always'` to keep loading Databuddy on\nevery page, as before.\n\nNew `features` switches turn Databuddy's interaction tracking, Web Vitals,\nerror tracking and outgoing link tracking on or off. `configWhenGranted` and\n`configWhenDenied` are now optional.\n\nThe guide also shows how to load Databuddy's session replay script only with\nmeasurement consent. See the\n[Databuddy guide](https://c15t.com/docs/integrations/databuddy).\n"
    filename: 2026-10-24-databuddy-after-consent.md
    v: 0.0.0
