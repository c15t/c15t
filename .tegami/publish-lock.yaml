core:changelogs:
  - content: "---\npackages:\n  c15t:\n    type: minor\n  \"@c15t/react\":\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/tanstack-start\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/ui\":\n    type: minor\n  \"@c15t/schema\":\n    type: minor\n---\n\n### Add an optional close button to the preference dialog\n\nThe stock preference dialog can now show a close button in its header, like\nthe IAB dialog. It closes the dialog without saving, the same as Escape: the\nbanner comes back if the policy still owes a choice. On touch screens it is\nthe only way out besides a consent choice, since the backdrop does not close\nthe dialog.\n\nIt is off by default, so existing dialogs look the same.\n\n- React, Next.js and TanStack Start: `<ConsentDialog showCloseButton />`. In a\n  composed dialog, `<ConsentDialog.Header showCloseButton>` renders it after the\n  header's children.\n- Vue and Nuxt: `dialogShowCloseButton: true` in the plugin options.\n- Svelte and SvelteKit: `<ConsentDialog showCloseButton />`.\n- Script tag: `ui: { dialog: { showCloseButton: true } }`.\n\nThe button is labelled with the `common.close` translation and has\n`data-testid=\"consent-dialog-close\"`. Style it with the `dialog.closeButton`\ncomponent slot or the `consentDialogCloseButton` theme slot.\n"
    filename: 2026-11-02-consent-dialog-close-button.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/core\":\n    type: patch\n---\n\n### Hide the \"Secured by\" tag when branding is `none`\n\nA backend that sets `branding: 'none'` now hides the \"Secured by\" tag in every\nstock UI, including the IAB banner. `KernelBranding` gains `'none'`.\n"
    filename: 2026-11-20-branding-none-hides-tag.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/iab\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/dev-tools\":\n    type: patch\n  \"@c15t/schema\":\n    type: patch\n---\n\n### Fix IAB TCF signals and vendor disclosures\n\n- Restricting two vendors no longer restricts the vendors between them.\n- Purposes that allow consent only (1, 3, 4, 5 and 6) no longer get a\n  legitimate interest signal from a custom vendor.\n- Legitimate interest switches show what Save records.\n- Vendor links render only for absolute `http` and `https` URLs.\n- Vendor disclosures show the standard TCF Features text.\n"
    filename: 2026-11-20-iab-signals-and-vendor-list.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/dev-tools\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Preference switches match what is in effect\n\n- A category that Global Privacy Control denies starts off when the visitor has\n  no saved choice, and saving records it as denied.\n- Vue and the script-tag UI show the restriction notice on a saved grant.\n- Categories start on under a `none` policy.\n"
    filename: 2026-11-20-preference-toggles-match-effect.md
    v: 0.0.0
  - content: "---\npackages:\n  c15t:\n    type: minor\n  \"@c15t/core\":\n    type: minor\n  \"@c15t/browser\":\n    type: minor\n  \"@c15t/nextjs\":\n    type: minor\n  \"@c15t/tanstack-start\":\n    type: minor\n  \"@c15t/astro\":\n    type: minor\n  \"@c15t/svelte\":\n    type: minor\n  \"@c15t/vue\":\n    type: minor\n---\n\n### Stop storing `c15t-sid` before a choice\n\nc15t no longer writes the `c15t-sid` cookie or localStorage key on first load.\nThe subject ID is stored with the visitor's first saved record, and a leftover\n`c15t-sid` is removed on start. `identify()` before the first save is sent\nwith that save.\n\n`resolveRequestSubject()` is deprecated, returns `null` without a saved\nconsent record cookie, and no longer returns a cookie to set. Each adapter's\n`subjectCookie` option (along with the cookie-writing `storage` and\n`trustForwardedHeaders` middleware options) does nothing. v4 removes them.\n\nIf your cookie policy lists `c15t-sid`, remove it.\n"
    filename: 2026-11-20-no-subject-id-before-choice.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n---\n\n### The \"Secured by\" tag shows the inth logo\n\nWith `inth` or `consent` branding, the banner and dialog tags from\n`@c15t/browser` showed the plain word \"inth\" where the other packages show\nthe inth logo. The tags now render the logo, sized and colored like the c15t\nmark.\n"
    filename: 2026-11-25-browser-inth-tag-logo.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n---\n\n### Fix Escape with stacked dialogs, legal links and phone padding\n\n- Escape closes only the top dialog across preference and IAB dialogs.\n- The preference dialog close button reserves header space without relying on CSS `:has()`.\n- Vue leaves out a legal link that has no URL instead of linking to `#`.\n- Legal links that open in a new tab get `rel=\"noopener noreferrer\"` by\n  default.\n- The banner and preferences dialog use even padding on phones.\n"
    filename: 2026-11-20-dialog-escape-legal-links-and-phone-padding.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/browser\":\n    type: patch\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  c15t:\n    type: patch\n---\n\n### Fix the IAB banner and dialog\n\n- The script-tag UI shows a registered vendor's data categories.\n- The script-tag IAB banner shows the partner count once.\n- In Vue, the partners link opens the dialog on the vendor list.\n- A failed IAB save is reported once. `saveIABConsentSurface` resolves\n  `{ ok: false }` instead of rejecting.\n- Vue records no IAB choice when no CMP is mounted.\n"
    filename: 2026-11-20-iab-dialog-fixes.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/ui\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/vue\":\n    type: patch\n  \"@c15t/svelte\":\n    type: patch\n  \"@c15t/astro\":\n    type: patch\n---\n\n### Prevent partially parsed consent banners from shifting\n\nKeep styled React, Vue/Nuxt, Svelte and Astro consent banners hidden until\ntheir serialized contents finish parsing in browsers that support CSS\n`:has()`. Vue/Nuxt, Svelte and Astro IAB banners now do the same, as React's\nalready did. Completed banners appear without waiting for hydration.\n\nBanner roots now end with a hidden `[data-c15t-stream-end]` element.\nSelectors such as `:last-child` and Tailwind `last:` on the root's children\nmatch that marker. Target the content's part, class or test ID instead.\n"
    filename: 2026-10-21-streamed-consent-banner-layout.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/vue\":\n    type: minor\n---\n\n### Support Nuxt 5 nightly server builds\n\nThe Nuxt module now registers portable `nuxt/server` handlers and Nitro 3\nplugin variants, while keeping the existing Nitro 2 files for Nuxt 4. The\ndefault server-rendered manifest route, DevTools tab and early `/init` script\nnow work with Nuxt 5 nightly builds without Nuxt's Nitro 2 compatibility layer.\n"
    filename: 2026-10-12-nuxt-5-server-variants.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/svelte\":\n    type: patch\n---\n\n### Fix Svelte `ConsentGate` and `ConsentDialogTrigger`\n\n- `ConsentGate` shows the blocked message with no button when a strict policy\n  leaves its category out. It also registers its category so preferences list\n  it, which can ask a returning visitor about that category again.\n- `ConsentDialogTrigger` answers Enter and Space after a drag.\n- `ConsentDialogTrigger` shows the same brand mark as the branding tag.\n"
    filename: 2026-11-20-svelte-gate-and-trigger.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n  \"@c15t/cli\":\n    type: patch\n  \"@c15t/scripts\":\n    type: patch\n---\n\n### Add Notra web analytics integration\n\n`notraAnalytics` from `@c15t/integrations/notra-analytics` loads Notra's\n`notra.js` after `measurement` consent. It loads the builds that\n`@usenotra/sdk` 2.0.0 pins, with subresource integrity, and takes the same\n`errors`, `hash` and `endpoint` settings as the SDK's `<NotraAnalytics />`.\n`notra.js` has no stop call, so keep the default page reload when consent is\nwithdrawn, and add the network blocker rule from the docs to stop its last\nreport as the page unloads. The CLI can add it during setup.\n"
    filename: 2026-11-10-notra-analytics.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/integrations\":\n    type: minor\n  \"@c15t/cli\":\n    type: patch\n  \"@c15t/scripts\":\n    type: patch\n---\n\n### Add Capless analytics integration\n\n`caplessAnalytics` from `@c15t/integrations/capless-analytics` loads Capless\nanalytics and session replay after `measurement` consent. Capless cannot stop a\nrunning replay, so keep the default page reload when consent is withdrawn. The\nCLI can add it during setup.\n"
    filename: 2026-11-06-capless-analytics.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/cli\":\n    type: patch\n---\n\n### Update zod and postcss in the CLI\n\n`@c15t/cli` now depends on zod 4.6.7 and postcss 8.5.33, which fix published\nsecurity advisories in the versions it pinned before.\n"
    filename: 2026-11-25-cli-dependency-security.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n  \"@c15t/react\":\n    type: patch\n  \"@c15t/schema\":\n    type: patch\n---\n\n### Fix the vendor list fallback, prefetch detection and option warnings\n\n- A cached Global Vendor List is served when a refresh fails, and a failed\n  fetch is retried after 60 seconds.\n- Prefetch requests are detected from more headers and forwarded by hosted SSR\n  renders and same-origin consent proxies, so they no longer count as visits\n  in session reports.\n- Changing any read-once provider option after mount warns in development.\n"
    filename: 2026-11-20-vendor-list-cache-and-reporting.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@c15t/core\":\n    type: patch\n---\n\n### Fix clearing, revocation cleanup and early script mounting\n\n- `clear()` also removes the `addtl_consent` cookie and localStorage entry.\n- A server-rendered page drops a choice that another tab cleared and adopts\n  any subject saved after that clear.\n- Revocation cleanup keeps the tab journey ID and `addtl_consent`.\n- A `target: 'body'` script mounted before `<body>` exists goes to `<head>`\n  instead of throwing.\n"
    filename: 2026-11-20-core-clear-and-storage.md
    v: 0.0.0
